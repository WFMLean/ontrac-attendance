<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OnTrac Attendance Console</title>
<style>
:root{
  --bg:#0A111F; --bg2:#0D1627; --card:#121C2E; --card2:#172338; --line:#22304A; --line2:#2C3C5A;
  --tx:#E6ECF5; --tx2:#AEB9CC; --mut:#7F8BA3;
  --red:#E23744; --cyan:#4EC9F5; --green:#3FCE8B; --amber:#F5B841;
  --s-pto:#3987e5; --s-per:#d95926; --s-med:#199e70; --s-ncns:#c98500; --s-late:#d55181; --s-lwop:#9085e9;
  --present:#1F4434; --off:#0E1626; --future:#182540;
  --mono:"Courier New",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.45 Arial,Helvetica,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--cyan)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.mono{font-family:var(--mono)}
.muted{color:var(--mut)} .tx2{color:var(--tx2)}
.hidden{display:none!important}
/* ---------- buttons & inputs ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--card2);padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap;font-size:13px}
.btn:hover{border-color:var(--cyan)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
.btn.primary:hover{filter:brightness(1.1)}
.btn.good{background:#16392B;border-color:var(--green);color:var(--green);font-weight:700}
.btn.bad{background:#3A1820;border-color:var(--red);color:#ff8a93;font-weight:700}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 8px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.inp,select.inp,textarea.inp{background:var(--bg2);border:1px solid var(--line2);border-radius:8px;padding:7px 10px;min-width:0}
.inp:focus{border-color:var(--cyan);outline:none}
textarea.inp{width:100%;resize:vertical;min-height:64px}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--tx2)}
label.fld>span{font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em;font-size:11px;color:var(--mut)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.spacer{flex:1}
/* ---------- pills ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:11px;font-family:var(--mono);border:1px solid var(--line2);background:var(--bg2);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--mut)}
.pill.ok{color:var(--green);border-color:#2b6b50}.pill.ok .dot{background:var(--green)}
.pill.warn{color:var(--amber);border-color:#7a5d1f}.pill.warn .dot{background:var(--amber)}
.pill.err{color:#ff8a93;border-color:#7a2a33}.pill.err .dot{background:var(--red)}
.pill.info{color:var(--cyan);border-color:#235a72}.pill.info .dot{background:var(--cyan)}
.tag{display:inline-block;padding:2px 7px;border-radius:5px;font-size:11px;font-weight:700;font-family:var(--mono);letter-spacing:.03em}
/* ---------- layout ---------- */
#app{display:grid;grid-template-columns:220px 1fr;grid-template-rows:56px 1fr;min-height:100vh}
header.top{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 18px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,#0C1526,#0A111F);position:sticky;top:0;z-index:30}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.02em}
.brand .logo{width:30px;height:30px;border-radius:7px;background:var(--red);display:grid;place-items:center;font-family:var(--mono);font-weight:700;color:#fff;font-size:13px}
.brand small{display:block;font-weight:400;color:var(--mut);font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.userchip{display:flex;align-items:center;gap:8px;font-size:12px}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--card2);border:1px solid var(--line2);display:grid;place-items:center;font-weight:700;font-size:11px;color:var(--cyan)}
nav.side{border-right:1px solid var(--line);background:var(--bg2);padding:14px 10px;display:flex;flex-direction:column;gap:3px;position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto}
nav.side button{display:flex;align-items:center;gap:10px;background:none;border:0;padding:9px 12px;border-radius:8px;cursor:pointer;color:var(--tx2);text-align:left;font-size:14px}
nav.side button:hover{background:var(--card)}
nav.side button.on{background:var(--card2);color:#fff;box-shadow:inset 3px 0 0 var(--red)}
nav.side .ico{width:18px;text-align:center;font-family:var(--mono);color:var(--cyan)}
nav.side .badge{margin-left:auto;background:var(--red);color:#fff;border-radius:999px;font-size:11px;padding:0 7px;font-weight:700}
nav.side .sect{font-family:var(--mono);font-size:10px;color:var(--mut);letter-spacing:.14em;text-transform:uppercase;margin:12px 12px 4px}
main{padding:20px 22px 60px;min-width:0}
.pagehead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.pagehead h1{margin:0;font-size:22px;letter-spacing:.01em}
.pagehead p{margin:2px 0 0;color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card h3{margin:0 0 2px;font-size:14px;letter-spacing:.02em}
.card .sub{color:var(--mut);font-size:12px;margin-bottom:12px}
.cardhead{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.cardhead>div:first-child{flex:1;min-width:0}
.dgrid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c7{grid-column:span 7}.c6{grid-column:span 6}.c5{grid-column:span 5}.c4{grid-column:span 4}
/* ---------- filter bar ---------- */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:14px;position:sticky;top:56px;z-index:20}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:var(--bg2)}
.seg button{border:0;background:none;padding:6px 10px;cursor:pointer;font-size:12px;color:var(--tx2);border-right:1px solid var(--line2)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--card2);color:#fff;box-shadow:inset 0 -2px 0 var(--cyan)}
/* ---------- KPI tiles ---------- */
.kpis{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px;margin-bottom:14px}
.kpis.k5{grid-template-columns:repeat(5,minmax(0,1fr));margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;position:relative;overflow:hidden}
.kpi .lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);display:flex;gap:6px;align-items:center}
.kpi .val{font-size:26px;font-weight:700;margin:6px 0 2px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .cmp{font-size:11.5px;color:var(--tx2);display:flex;gap:6px;align-items:center}
.kpi .bar{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--line2)}
.kpi.good .bar{background:var(--green)}.kpi.warn .bar{background:var(--amber)}.kpi.bad .bar{background:var(--red)}
.st-good{color:var(--green)}.st-warn{color:var(--amber)}.st-bad{color:#ff6b75}
.info-i{cursor:help;border:1px solid var(--line2);border-radius:50%;width:14px;height:14px;display:inline-grid;place-items:center;font-size:9px;color:var(--mut)}
/* ---------- alert band ---------- */
.band{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border:1px solid #7a5d1f;background:#21190A;border-radius:var(--r);padding:10px 14px;margin-bottom:14px;font-size:13px}
.band.ok{border-color:#2b6b50;background:#0E2219}
/* ---------- tables ---------- */
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:8px}
table.tbl{border-collapse:collapse;width:100%;font-size:13px}
.tbl th{position:sticky;top:0;background:var(--card2);text-align:left;font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);padding:8px 10px;border-bottom:1px solid var(--line2);white-space:nowrap;z-index:1}
.tbl th.sortable{cursor:pointer}.tbl th.sortable:hover{color:var(--tx)}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:hover td{background:#152038}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl tfoot td{font-weight:700;background:var(--card2);position:sticky;bottom:0}
.tbl tr.click{cursor:pointer}
/* ---------- heatmap ---------- */
.hm-wrap{overflow:auto;max-height:520px;border:1px solid var(--line);border-radius:8px}
table.hm{border-collapse:separate;border-spacing:2px;font-size:11px}
.hm th{position:sticky;top:0;background:var(--card);font-family:var(--mono);font-weight:400;color:var(--mut);padding:3px 2px;z-index:2;font-size:10px;min-width:26px}
.hm th.we{color:var(--tx2)}
.hm td.nm{position:sticky;left:0;background:var(--card);z-index:1;white-space:nowrap;padding:0 8px 0 2px;max-width:210px;overflow:hidden;text-overflow:ellipsis;color:var(--tx2)}
.hm th.nm{left:0;z-index:3;text-align:left}
.hm .c{width:26px;height:20px;border-radius:4px;text-align:center;font-family:var(--mono);font-size:9.5px;line-height:20px;font-weight:700;color:#fff;cursor:pointer}
.c.off{background:var(--off);color:transparent;cursor:default}
.c.present{background:var(--present);color:#7fd8ad}
.c.future{background:var(--future);color:transparent}
.c.unset{background:transparent;box-shadow:inset 0 0 0 1px #7a2a33;color:#ff8a93}
.c.PTO{background:var(--s-pto)}.c.LWOP{background:var(--s-lwop)}.c.PERSONAL{background:var(--s-per)}.c.MEDICAL{background:var(--s-med)}.c.NCNS{background:var(--s-ncns)}.c.LATE,.c.UNDERTIME{background:var(--s-late)}
.c.req{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.18) 0 2px,transparent 2px 6px)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--tx2);align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px}
/* ---------- charts ---------- */
.chart{width:100%;position:relative}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{fill:var(--mut);font-size:10.5px;font-family:Arial,sans-serif}
.chart .grid line{stroke:#1D2A42;stroke-width:1}
.chart .axis line{stroke:var(--line2)}
.chart .hit{fill:transparent;cursor:crosshair}
.chart .tline{stroke:var(--amber);stroke-width:1.5;stroke-dasharray:5 4}
.chart .tlabel{fill:var(--amber);font-family:var(--mono);font-size:10px}
#tip{position:fixed;pointer-events:none;z-index:200;background:#0B1424;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.45);max-width:280px;display:none}
#tip .t{font-weight:700;margin-bottom:4px}
#tip .r{display:flex;gap:8px;align-items:center;justify-content:space-between}
#tip .r i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:6px}
#tip .r b{font-variant-numeric:tabular-nums}
/* ---------- attendance tagging ---------- */
.att-row{display:grid;grid-template-columns:minmax(180px,1.3fr) 130px minmax(330px,2.4fr) minmax(140px,1fr);gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line)}
.att-row:hover{background:#142036}
.att-row.dirty{box-shadow:inset 3px 0 0 var(--cyan)}
.att-row .nm{font-weight:700;font-size:13px}
.att-row .meta{font-size:11.5px;color:var(--mut)}
.stbtns{display:flex;flex-wrap:wrap;gap:4px}
.stbtns button{border:1px solid var(--line2);background:var(--bg2);border-radius:6px;padding:4px 7px;font-size:11.5px;cursor:pointer;color:var(--tx2)}
.stbtns button:hover{border-color:var(--cyan)}
.stbtns button.on{color:#fff;font-weight:700;border-color:transparent}
.stbtns button.on[data-s=PRESENT]{background:#23704E}
.stbtns button.on[data-s=LATE],.stbtns button.on[data-s=UNDERTIME]{background:var(--s-late)}
.stbtns button.on[data-s=PTO]{background:var(--s-pto)}.stbtns button.on[data-s=LWOP]{background:var(--s-lwop)}
.stbtns button.on[data-s=PERSONAL]{background:var(--s-per)}.stbtns button.on[data-s=MEDICAL]{background:var(--s-med)}.stbtns button.on[data-s=NCNS]{background:var(--s-ncns)}
.minsin{width:70px}
.savebar{position:sticky;bottom:12px;display:flex;gap:10px;align-items:center;background:#0F1A2E;border:1px solid var(--cyan);border-radius:var(--r);padding:10px 14px;margin-top:12px;box-shadow:0 10px 30px rgba(0,0,0,.4);z-index:15}
/* ---------- schedule grid ---------- */
.sg td.sc{font-family:var(--mono);font-size:11.5px;white-space:nowrap;text-align:center}
.sg td.sc.off{color:var(--mut);background:#0E1626}
.sg td.sc.ovr{box-shadow:inset 0 0 0 1px var(--cyan);color:var(--cyan)}
.sg td.sc.lv{background:#14294A;color:#9cc4f5}
.sg td.sc.edit{cursor:pointer}
/* ---------- requests ---------- */
.req{border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:14px;margin-bottom:12px}
.req .hd{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.req .hd b{font-size:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:12.5px}
.kv dt{color:var(--mut);font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.kv dd{margin:0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tabs button{background:none;border:0;padding:9px 14px;cursor:pointer;color:var(--tx2);border-bottom:2px solid transparent;font-size:13.5px}
.tabs button.on{color:#fff;border-bottom-color:var(--red);font-weight:700}
.preview{background:var(--bg2);border:1px dashed var(--line2);border-radius:8px;padding:12px;font-size:12.5px}
.ba{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.ba .box{background:var(--card2);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;font-family:var(--mono);font-size:12px}
.ba .arrow{color:var(--cyan);font-family:var(--mono)}
/* ---------- modal & toast ---------- */
.mbg{position:fixed;inset:0;background:rgba(3,7,15,.72);display:grid;place-items:center;z-index:100;padding:16px}
.modal{background:var(--card);border:1px solid var(--line2);border-radius:12px;width:min(640px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.modal .mh{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:2}
.modal .mh h3{margin:0;font-size:16px;flex:1}
.modal .mb{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.modal .mf{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--card)}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:300}
.toast{background:#0F1A2E;border:1px solid var(--line2);border-left:3px solid var(--cyan);padding:10px 14px;border-radius:8px;font-size:13px;max-width:360px;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.toast.ok{border-left-color:var(--green)}.toast.err{border-left-color:var(--red)}
/* ---------- auth ---------- */
.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(1200px 600px at 20% -10%,#14223D 0,transparent 60%),var(--bg)}
.auth .box{width:min(460px,100%);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px}
.auth h2{margin:14px 0 4px;font-size:20px}
.demo-list{display:flex;flex-direction:column;gap:6px;max-height:340px;overflow:auto}
.demo-list button{display:flex;gap:10px;align-items:center;text-align:left;background:var(--bg2);border:1px solid var(--line2);border-radius:8px;padding:9px 12px;cursor:pointer}
.demo-list button:hover{border-color:var(--cyan)}
.empty{padding:28px;text-align:center;color:var(--mut);border:1px dashed var(--line2);border-radius:var(--r)}
.empty b{display:block;color:var(--tx);margin-bottom:6px;font-size:14px}
.note{font-size:12px;color:var(--mut)}
.warnbox{border:1px solid #7a5d1f;background:#21190A;color:#F5D58A;border-radius:8px;padding:9px 12px;font-size:12.5px}
.errbox{border:1px solid #7a2a33;background:#2A0F15;color:#ffb3b9;border-radius:8px;padding:9px 12px;font-size:12.5px}
.okbox{border:1px solid #2b6b50;background:#0E2219;color:#9be7c3;border-radius:8px;padding:9px 12px;font-size:12.5px}
/* ---------- responsive ---------- */
@media (max-width:1280px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}.kpis.k5{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media (max-width:1080px){.kpis.k5{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:1080px){.c8,.c7,.c6,.c5,.c4{grid-column:span 12}.att-row{grid-template-columns:1fr 1fr}.att-row .stbtns{grid-column:1/-1}}
@media (max-width:820px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:56px auto 1fr}
  .seg{flex-wrap:wrap;max-width:100%}
  .filters .fld{max-width:100%}
  header.top .pill{padding:3px 7px;font-size:9.5px;letter-spacing:.02em}
  nav.side{position:sticky;top:56px;height:auto;flex-direction:row;overflow-x:auto;padding:6px;border-right:0;border-bottom:1px solid var(--line);z-index:25}
  nav.side .sect{display:none}
  nav.side button{flex:0 0 auto;padding:8px 10px;font-size:13px}
  nav.side button.on{box-shadow:inset 0 -3px 0 var(--red)}
  main{padding:14px 16px 60px}
  .filters{position:static}
  .kpis,.kpis.k5{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2,.grid3{grid-template-columns:1fr}
  .userchip .uname,.brand small,.hide-sm{display:none}
  header.top{gap:8px;padding:0 12px}
  .att-row{grid-template-columns:1fr}
}
@media (max-width:480px){.brand>div:last-child{display:none}#signout{padding:4px 6px}}
</style>
</head>
<body>
<div id="root"></div>
<div id="tip"></div>
<div id="toasts"></div>

<script>
/* =====================================================================
   OnTrac Attendance Console — single-file app
   CONFIG: paste the Database project URL + public (anon) key below to go
   live. While they hold the placeholder values the app runs in DEMO mode
   (data stays in this browser). An Admin can also connect at runtime in
   Admin → Data. The public key is safe to ship ONLY because row-level
   security in ontrac_attendance_schema.sql enforces every permission.
   ===================================================================== */
const CONFIG = {
  DB_URL: 'https://xrzpbkilkswyflzagcfw.supabase.co',          // e.g. https://abcd1234.supabase.co
  DB_KEY: 'sb_publishable_rSCf1L6KRfyoE6cwrdctsQ_HZepINkD',
  DB_LIB: 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2',
  XLSX_LIB: 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
  APP_VERSION: '1.0.0'
};
const SEED = null;

/* ---------------- utilities ---------------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s || '').trim().toUpperCase().replace(/\s+/g, ' ');
const uid = p => p + '-' + Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2, 5).toUpperCase();
const pct = (v, d = 1) => v == null || isNaN(v) ? '—' : (v * 100).toFixed(d) + '%';
const num = (v, d = 1) => v == null || isNaN(v) ? '—' : (+v).toLocaleString('en-US', {maximumFractionDigits: d, minimumFractionDigits: d});
const int = v => v == null || isNaN(v) ? '—' : Math.round(v).toLocaleString('en-US');
const initials = n => String(n || '?').replace(/,.*/, m => ' ' + m.slice(1)).trim().split(/\s+/).slice(0, 2).map(x => x[0]).join('').toUpperCase();

<script>

const TABLES = {agents: 'ot_agents', att: 'ot_attendance', ovr: 'ot_overrides', reqs: 'ot_requests', settings: 'ot_settings', profiles: 'ot_profiles', audit: 'ot_audit'};

  async loadLive() {

      Store.fetchAll(TABLES.agents),

      Store.fetchAll(TABLES.ovr, q => q.gte('date', since)),

        const k = map[tb], row = ev.new && Object.keys(ev.new).length ? ev.new : null, old = ev.old;
        if (k === 'att' || k === 'ovr') { if (ev.eventType === 'DELETE') delete S[k][old.id]; else S[k][row.id] = row; }
        else if (k === 'settings') { if (row && row.key === 'app') S.settings = {...S.settings, ...row.value}; if (row && row.key === 'allowed_domains') S.settings.allowedDomains = row.value; }
        else { const arr = S[k]; const id = (row || old).id; const i = arr.findIndex(x => x.id === id); if (ev.eventType === 'DELETE') { if (i >= 0) arr.splice(i, 1); } else if (i >= 0) arr[i] = row; else arr.push(row); }
        later();
      });
    }
    ch.subscribe(st => { S.connected = st === 'SUBSCRIBED' || S.connected; renderPill(); });
    S._chan = ch;
  },
  async _up(table, rows) {
    if (S.mode !== 'live' || !rows.length) return;
    for (let i = 0; i < rows.length; i += 500) {
      const {error} = await S.sb.from(table).upsert(rows.slice(i, i + 500));
      if (error) throw error;
    }
  },
  async _del(table, ids) {
    if (S.mode !== 'live' || !ids.length) return;
    const {error} = await S.sb.from(table).delete().in('id', ids);
    if (error) throw error;
  },
  async run(fn) {
    try { await fn(); Store.persistDemo(); reindex(); return true; }
    catch (e) {
      console.warn(e); toast('Not saved: ' + (e.message || e), 'err');
      if (S.mode === 'live') { try { await Store.loadLive(); } catch (_) {} }
      reindex(); render(); return false;
    }
  },
  /* ---------- writes ---------- */
  saveAttendance(recs, delIds = []) {
    return Store.run(async () => {
      for (const r of recs) S.att[r.id] = r;
      for (const id of delIds) delete S.att[id];
      await Store._up(TABLES.att, recs); await Store._del(TABLES.att, delIds);
    });
  },
  saveRequest(r) {
    return Store.run(async () => {
      const i = S.reqs.findIndex(x => x.id === r.id), isNew = i < 0;
      if (isNew) S.reqs.push(r); else S.reqs[i] = r;
      if (S.mode !== 'live') return;
      /* plain UPDATE for existing rows so a TL cancel isn't checked against the insert policy (upsert would be) */
      const {error} = isNew ? await S.sb.from(TABLES.reqs).insert(r) : await S.sb.from(TABLES.reqs).update(r).eq('id', r.id);
      if (error) throw error;
    });
  },
  saveOverrides(list, delIds = []) {
    return Store.run(async () => {
      for (const o of list) S.ovr[o.id] = o; for (const id of delIds) delete S.ovr[id];
      await Store._up(TABLES.ovr, list); await Store._del(TABLES.ovr, delIds);
    });
  },
  saveAgents(list) { return Store.run(async () => { for (const a of list) { const i = S.agents.findIndex(x => x.id === a.id); if (i >= 0) S.agents[i] = a; else S.agents.push(a); } await Store._up(TABLES.agents, list); }); },
  saveSettings(st) {
    return Store.run(async () => {
      S.settings = {...S.settings, ...st};
      if (S.mode === 'live') {
        const {allowedDomains, ...app} = S.settings;
        await Store._up(TABLES.settings, [{key: 'app', value: app, updated_by: S.user.email, updated_at: new Date().toISOString()},
          {key: 'allowed_domains', value: allowedDomains, updated_by: S.user.email, updated_at: new Date().toISOString()}]);
      }
    });
  },
  saveProfile(p) {
    return Store.run(async () => {
      const i = S.profiles.findIndex(x => x.id === p.id); if (i >= 0) S.profiles[i] = p; else S.profiles.push(p);
      if (S.mode === 'live') { const {error} = await S.sb.from(TABLES.profiles).update({full_name: p.full_name, role: p.role, tl_name: p.tl_name, approved: p.approved}).eq('id', p.id); if (error) throw error; }
    });
  },
  deleteProfile(id) { return Store.run(async () => { S.profiles = S.profiles.filter(p => p.id !== id); await Store._del(TABLES.profiles, [id]); }); },
  async audit(action, detail = {}) {
    const row = {ts: new Date().toISOString(), actor: S.user ? S.user.email : 'system', action, detail};
    S.audit.unshift({id: uid('AU'), ...row}); if (S.audit.length > 500) S.audit.length = 500;
    if (S.mode === 'live') { try { await S.sb.from(TABLES.audit).insert(row); } catch (e) {} } else Store.persistDemo();
  },
  /* ---------- seed / backup ---------- */
  async seedLive() {
    const p = seedPayload();
    return Store.run(async () => {
      await Store._up(TABLES.agents, p.agents); await Store._up(TABLES.ovr, p.ovr); await Store._up(TABLES.att, p.att);
      const have = new Set(S.reqs.map(r => r.id)); await Store._up(TABLES.reqs, p.reqs.filter(r => !have.has(r.id)));
      await Store.loadLive();
    });
  }
};

/* =====================================================================
   AUTH
   ===================================================================== */
const Auth = {
  async restore() {
    if (S.mode === 'demo') {
      const id = lsGet(LS_DEMOUSER); const p = S.profiles.find(x => x.id === id && x.approved);
      if (p) S.user = {...p};
      return;
    }
    const {data} = await S.sb.auth.getSession();
    if (data && data.session) await Auth.loadProfile(data.session.user);
    S.sb.auth.onAuthStateChange(async (ev, session) => {
      if (ev === 'PASSWORD_RECOVERY') Auth.promptNewPassword();
      if (ev === 'SIGNED_OUT') { S.user = null; render(); }
    });
  },
  async loadProfile(u) {
    const {data, error} = await S.sb.from(TABLES.profiles).select('*').eq('id', u.id).maybeSingle();
    if (error) throw error;
    if (!data) { S.user = {id: u.id, email: u.email, role: 'TL', approved: false, missing: true}; return; }
    S.user = data;
    if (data.approved) { await Store.loadLive(); Store.subscribe(); }
  },
  domainOk(email) {
    const dom = String(email || '').split('@')[1]?.toLowerCase();
    const list = (S.settings.allowedDomains || []).map(x => x.toLowerCase());
    return !list.length || list.includes(dom);
  },
  async signIn(email, pw) {
    const {data, error} = await S.sb.auth.signInWithPassword({email: email.trim(), password: pw});
    if (error) throw error;
    await Auth.loadProfile(data.user);
    await Store.audit('sign_in', {});
  },
  async signUp(f) {
    if (!Auth.domainOk(f.email)) throw new Error('Use your company email (' + (S.settings.allowedDomains || []).join(', ') + ').');
    const {data, error} = await S.sb.auth.signUp({email: f.email.trim(), password: f.pw,
      options: {data: {app: 'ontrac', full_name: f.name, role: f.role, tl_name: f.tl}, emailRedirectTo: location.href.split('#')[0]}});
    if (error) throw new Error(/database error/i.test(error.message) ? 'This email domain is not allowed. Use your company email.' : /already registered/i.test(error.message) ? 'This email already has an account in this database. Sign in with that password, then request OnTrac access.' : error.message);
    return data;
  },
  async reset(email) {
    const {error} = await S.sb.auth.resetPasswordForEmail(email.trim(), {redirectTo: location.href.split('#')[0]});
    if (error) throw error;
  },
  async claim(name, role, tl) {
    const {error} = await S.sb.rpc('ot_claim_profile', {p_name: name, p_role: role, p_tl: tl});
    if (error) throw new Error(/not allowed/i.test(error.message) ? 'Your email domain is not allowed for this app.' : error.message);
    const {data} = await S.sb.auth.getUser(); await Auth.loadProfile(data.user);
  },
  promptNewPassword() {
    modal('Set a new password', `<label class="fld"><span>New password (min 8)</span><input class="inp" type="password" id="np1" autocomplete="new-password"></label>`,
      [{label: 'Save password', cls: 'primary', onClick: async () => {
        const v = $('#np1').value; if (v.length < 8) { toast('Use at least 8 characters.', 'err'); return false; }
        const {error} = await S.sb.auth.updateUser({password: v}); if (error) { toast(error.message, 'err'); return false; }
        toast('Password updated.', 'ok');
      }}]);
  },
  async signOut() {
    if (S.mode === 'live') { await Store.audit('sign_out', {}); await S.sb.auth.signOut(); if (S._chan) { S.sb.removeChannel(S._chan); S._chan = null; } }
    else lsDel(LS_DEMOUSER);
    S.user = null; render();
  },
  demoSignIn(id) { const p = S.profiles.find(x => x.id === id); if (!p) return; S.user = {...p}; lsSet(LS_DEMOUSER, id); S.view = 'dash'; Store.audit('sign_in', {demo: true}); render(); }
};
</script>

function pendingCount() { const mine = myTeamKey(); return S.reqs.filter(r => r.status === 'Pending' && (mine === null || norm((S.idx.agent[r.agent] || {}).tl) === mine)).length; }

function render() {

function renderAuth(root) {

    root.innerHTML = `<div class="auth"><div class="box">
      <div class="brand"><div class="logo">OT</div><div>OnTrac Attendance<small>Ops · Attendance · PTO · Swaps</small></div></div>
      <h2>Sign in</h2>
      <div class="row" style="margin-bottom:12px"><span class="pill warn"><span class="dot"></span>Database · Demo mode</span><span class="note">Data stays in this browser.</span></div>
      <p class="note" style="margin-top:0">Pick a demo identity to explore each role. When the Database is connected, this screen becomes an email + password sign-in.</p>
      <div class="demo-list">${opts}</div></div></div>`;
    $$('.demo-list button', root).forEach(b => b.onclick = () => Auth.demoSignIn(b.dataset.id));
    return;
  }
  const tab = S._authTab || 'in';
  root.innerHTML = `<div class="auth"><div class="box">
    <div class="brand"><div class="logo">OT</div><div>OnTrac Attendance<small>Ops · Attendance · PTO · Swaps</small></div></div>
    <h2>${tab === 'in' ? 'Sign in' : tab === 'up' ? 'Request access' : 'Reset password'}</h2>
    <p class="note" style="margin-top:0">${tab === 'up' ? 'Use your company email. An RTA admin approves new accounts and links you to your team.' : 'Team Leads and RTAs sign in with their company email.'}</p>
    <form id="af" class="mb" style="display:flex;flex-direction:column;gap:12px;padding:0">
      ${tab === 'up' ? `<label class="fld"><span>Full name</span><input class="inp" id="a_name" required autocomplete="name"></label>` : ''}
      <label class="fld"><span>Company email</span><input class="inp" id="a_email" type="email" required autocomplete="email" placeholder="name@${esc((S.settings.allowedDomains || ['company.com'])[0])}"></label>
      ${tab !== 'reset' ? `<label class="fld"><span>Password</span><input class="inp" id="a_pw" type="password" required minlength="8" autocomplete="${tab === 'up' ? 'new-password' : 'current-password'}"></label>` : ''}
      ${tab === 'up' ? `<div class="grid2"><label class="fld"><span>Role requested</span><select class="inp" id="a_role"><option value="TL">Team Lead</option><option value="RTA">RTA</option></select></label>
        <label class="fld"><span>Team (roster name)</span><input class="inp" id="a_tl" placeholder="LAST, FIRST MIDDLE"></label></div>` : ''}
      <div id="a_msg"></div>
      <button class="btn primary" type="submit" style="justify-content:center">${tab === 'in' ? 'Sign in' : tab === 'up' ? 'Create account' : 'Send reset link'}</button>
    </form>
    <div class="row" style="justify-content:space-between;margin-top:12px;font-size:12.5px">
      ${tab !== 'in' ? '<a href="#" data-t="in">Back to sign in</a>' : '<a href="#" data-t="up">Request access</a><a href="#" data-t="reset">Forgot password?</a>'}
    </div></div></div>`;
  $$('[data-t]', root).forEach(a => a.onclick = e => { e.preventDefault(); S._authTab = a.dataset.t; render(); });
  $('#af').onsubmit = async e => {
    e.preventDefault();

    try {

      if (tab === 'in') { await Auth.signIn(email, $('#a_pw').value); render(); }
      else if (tab === 'up') {
        await Auth.signUp({email, pw: $('#a_pw').value, name: $('#a_name').value.trim(), role: $('#a_role').value, tl: $('#a_tl').value.trim().toUpperCase()});

    } catch (err) { msg.innerHTML = `<div class="errbox">${esc(/invalid login/i.test(err.message) ? 'Email or password is incorrect.' : /not confirmed/i.test(err.message) ? 'Confirm your email first — check your inbox for the link.' : err.message)}</div>`; }
    btn.disabled = false;

}
function renderPending(root) {
  root.innerHTML = `<div class="auth"><div class="box">
    <div class="brand"><div class="logo">OT</div><div>OnTrac Attendance<small>Ops · Attendance · PTO · Swaps</small></div></div>
    <h2>${S.user.missing ? 'Request access' : 'Waiting for approval'}</h2>
    <p class="tx2">You're signed in as <b>${esc(S.user.email)}</b>. An RTA admin needs to approve your account and link it to your team before you can submit statuses or requests.</p>
    ${S.user.missing ? `<div class="warnbox" style="margin-bottom:12px">This account isn't registered for OnTrac yet. Request access below.</div>
      <div style="display:flex;flex-direction:column;gap:10px"><label class="fld"><span>Full name</span><input class="inp" id="c_name"></label>
      <div class="grid2"><label class="fld"><span>Role requested</span><select class="inp" id="c_role"><option value="TL">Team Lead</option><option value="RTA">RTA</option></select></label>
      <label class="fld"><span>Team (roster name)</span><input class="inp" id="c_tl" placeholder="LAST, FIRST MIDDLE"></label></div>
      <div id="c_msg"></div><button class="btn primary" id="c_go" style="justify-content:center">Request OnTrac access</button></div>` : ''}
    <div class="row" style="margin-top:16px"><button class="btn" id="pchk">Check again</button><button class="btn ghost" id="pout">Sign out</button></div></div></div>`;
  $('#pout').onclick = () => Auth.signOut();
  if ($('#c_go')) $('#c_go').onclick = async () => { try { await Auth.claim($('#c_name').value.trim(), $('#c_role').value, $('#c_tl').value); render(); } catch (e) { $('#c_msg').innerHTML = `<div class="errbox">${esc(e.message)}</div>`; } };
  $('#pchk').onclick = async () => { if (S.mode === 'live') { const {data} = await S.sb.auth.getUser(); if (data.user) await Auth.loadProfile(data.user); } render(); };
}

/* shared UI helpers */
function teamSelect(id, val, allowAll = true) {
  const mine = myTeamKey();
  if (mine !== null) return `<select class="inp" id="${id}" disabled><option>${esc(teamLabel(S.user.tl_name))}</option></select>`;
  return `<select class="inp" id="${id}">${allowAll ? `<option value="ALL">All teams</option>` : ''}${teams().map(t => `<option value="${esc(t.key)}" ${t.key === val ? 'selected' : ''}>${esc(t.label)}</option>`).join('')}</select>`;
}
function agentOptions(list, sel) { return list.map(a => `<option value="${a.id}" ${a.id === sel ? 'selected' : ''}>${esc(a.name)}</option>`).join(''); }
function statusTag(s) {
  const c = {Pending: 'warn', Approved: 'ok', Denied: 'err', Cancelled: ''}[s] || '';
  const ic = {Pending: '◷', Approved: '✓', Denied: '✕', Cancelled: '–'}[s] || '';
  return `<span class="pill ${c}">${ic} ${esc(s)}</span>`;
}
function head(title, sub, right = '') { return `<div class="pagehead"><div><h1>${esc(title)}</h1><p>${sub}</p></div><div class="spacer"></div>${right}</div>`; }
function download(name, text, type = 'text/csv') { const b = new Blob([text], {type}); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }
function toCSV(rows) { if (!rows.length) return ''; const h = Object.keys(rows[0]); const q = v => { const s = v == null ? '' : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }; return [h.join(','), ...rows.map(r => h.map(k => q(r[k])).join(','))].join('\n'); }
async function exportXlsx(name, sheets) {
  try {
    if (!window.XLSX) await loadScript(CONFIG.XLSX_LIB);
    const wb = XLSX.utils.book_new();
    for (const [sn, rows] of Object.entries(sheets)) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows.length ? rows : [{note: 'No rows'}]), sn.slice(0, 31));
    XLSX.writeFile(wb, name);
  } catch (e) {
    toast('Excel library unavailable offline — downloading CSV instead.', 'err');
    const [sn, rows] = Object.entries(sheets)[0]; download(name.replace(/\.xlsx$/, '') + '_' + sn + '.csv', toCSV(rows));
  }
}
</script>

<script>
/* =====================================================================
   CHARTS — hand-rolled SVG (no dependency; works offline)
   One y-axis per chart, thin marks, 2px surface gaps, hover layer on all.
   ===================================================================== */
const SVGNS = 'http://www.w3.org/2000/svg';
function niceMax(v) { if (!(v > 0)) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }
function topRound(x, y, w, h, r) { r = Math.min(r, w / 2, h); if (h <= 0) return ''; return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`; }
const Chart = {
  frame(el, h) { const w = Math.max(260, el.clientWidth || 600); return {w, h, m: {t: 14, r: 14, b: 28, l: 46}}; },
  yAxis(g, f, max, fmt, ticks = 4) {
    let s = '';
    for (let i = 0; i <= ticks; i++) {
      const v = max * i / ticks, y = f.m.t + (f.h - f.m.t - f.m.b) * (1 - i / ticks);
      s += `<g class="grid"><line x1="${f.m.l}" x2="${f.w - f.m.r}" y1="${y}" y2="${y}"/></g><text x="${f.m.l - 6}" y="${y + 3.5}" text-anchor="end">${esc(fmt(v))}</text>`;
    }
    return s;
  },
  xLabels(f, labels, x, bw) {
    const every = Math.max(1, Math.ceil(labels.length / Math.max(1, (f.w - f.m.l - f.m.r) / 52)));
    return labels.map((l, i) => i % every ? '' : `<text x="${x(i) + bw / 2}" y="${f.h - 8}" text-anchor="middle">${esc(l)}</text>`).join('');
  },
  target(f, y, label) { return `<line class="tline" x1="${f.m.l}" x2="${f.w - f.m.r}" y1="${y}" y2="${y}"/><text class="tlabel" x="${f.w - f.m.r}" y="${y - 5}" text-anchor="end">${esc(label)}</text>`; },
  /* stacked bars: series=[{name,color,values[]}]; tipRows(i) optional */
  stacked(el, o) {
    const f = Chart.frame(el, o.h || 240), n = o.labels.length;
    const totals = o.labels.map((_, i) => o.series.reduce((s, x) => s + (x.values[i] || 0), 0));

function dashRange() {
  const d = S.dash, t = TODAY;
  if (!d.preset) d.preset = 'MTD';
  const ws = D.weekStart(t);
  const P = {
    TODAY: [t, t], YEST: [D.add(t, -1), D.add(t, -1)], WEEK: [ws, t], LWEEK: [D.add(ws, -7), D.add(ws, -1)],
    MTD: [D.monthStart(t), t], MONTH: [D.monthStart(t), D.monthEnd(t)], LMONTH: [D.monthStart(D.add(D.monthStart(t), -1)), D.add(D.monthStart(t), -1)], L30: [D.add(t, -29), t]
  };
  if (d.preset !== 'CUSTOM') [d.from, d.to] = P[d.preset];
  return [d.from, d.to];
}
function kpiState(v, t, dir) {
  if (v == null) return ['', '', 'No data'];
  if (dir === 'le') { if (v <= t) return ['good', 'st-good', '✓ Within target']; if (v <= t * 1.2) return ['warn', 'st-warn', '▲ ' + ((v - t) * 100).toFixed(1) + ' pts over']; return ['bad', 'st-bad', '▲ ' + ((v - t) * 100).toFixed(1) + ' pts over']; }
  if (v >= t) return ['good', 'st-good', '✓ On target']; if (v >= t - 0.03) return ['warn', 'st-warn', '▼ ' + ((t - v) * 100).toFixed(1) + ' pts under']; return ['bad', 'st-bad', '▼ ' + ((t - v) * 100).toFixed(1) + ' pts under'];
}
function kpiTile(lbl, val, cmp, cls, def) {

}

  $('#dexp').onclick = () => exportDash(agents, dates, D.range(from, to));
  $$('#hcview button').forEach(b => b.onclick = () => { d.hcView = b.dataset.v; render(); });
  renderHC(agents, D.range(from, to));
  renderPM(agents, D.range(from, to));

  /* --- trend --- */
  const buckets = [];
  if (d.gran === 'week') { const m = new Map(); for (const x of dates) { const w = D.weekStart(x); if (!m.has(w)) m.set(w, []); m.get(w).push(x); } for (const [w, ds] of m) buckets.push({label: 'WB ' + D.md(w), title: 'Week of ' + D.fmt(w) + ' (Sat–Fri)', dates: ds}); }
  else for (const x of dates) buckets.push({label: D.md(x), title: D.fmt(x), dates: [x]});
  const bAgg = buckets.map(b => aggregate(agents, b.dates));
  const pf = (v, t) => t ? pct(v, 2) : pct(v, 0);
  if (buckets.length) {
    Chart.stacked($('#ch_trend'), {labels: buckets.map(b => b.label), tipTitle: i => buckets[i].title, yFmt: pf, aria: 'Shrinkage trend by reason',
      series: CAT.map(c => ({name: c.label, color: c.color, values: bAgg.map(z => z.schedHrs ? z.catHrs[c.key] / z.schedHrs : 0)})),
      target: {value: st.unplTarget + st.planTarget, label: 'Ceiling ' + pct(st.unplTarget + st.planTarget, 0)},
      tipExtra: i => `<div class="note" style="margin-top:4px">${num(bAgg[i].lostHrs, 1)} lost of ${int(bAgg[i].schedHrs)} sched hrs · ${bAgg[i].unset} not submitted</div>`,
      onClick: d.gran === 'day' && dates.length > 1 ? i => { d.preset = 'CUSTOM'; d.from = d.to = buckets[i].dates[0]; render(); } : null});
    Chart.line($('#ch_att'), {labels: buckets.map(b => b.label), tipTitle: i => buckets[i].title, yFmt: pf, yMax: 1, aria: 'Attendance trend',
      series: [{name: 'Attendance', color: '#4EC9F5', values: bAgg.map(z => z.att)}], target: {value: st.attTarget, label: 'Goal ' + pct(st.attTarget, 0)},
      tipExtra: i => `<div class="note" style="margin-top:4px">${bAgg[i].absentDays} absent of ${bAgg[i].schedDays} scheduled${bAgg[i].unset ? ' · ' + bAgg[i].unset + ' not submitted' : ''}</div>`});
  } else { $('#ch_trend').innerHTML = $('#ch_att').innerHTML = '<div class="note">Range is in the future — see the 14-day outlook.</div>'; }

  /* --- mix --- */
  Chart.hbars($('#ch_mix'), CAT.map(c => ({label: c.label, color: c.color, value: tot.catHrs[c.key], text: num(tot.catHrs[c.key], 1) + ' h',
    tip: `<div class="t">${c.label}</div><div class="r"><span>Hours lost</span><b>${num(tot.catHrs[c.key], 1)}</b></div><div class="r"><span>Occurrences</span><b>${tot.catCnt[c.key]}</b></div><div class="r"><span>Share of sched hrs</span><b>${pct(tot.schedHrs ? tot.catHrs[c.key] / tot.schedHrs : null, 2)}</b></div>`})));
  /* --- weekday --- */
  const dowAgg = DAYS.map((_, k) => aggregate(agents, dates.filter(x => D.dowIdx(x) === k)));
  Chart.stacked($('#ch_dow'), {labels: DAYS, h: 150, yFmt: pf, aria: 'Unplanned shrinkage by weekday',
    series: [{name: 'Unplanned', color: '#4EC9F5', values: dowAgg.map(z => z.unplPct || 0)}], target: {value: st.unplTarget, label: '≤ ' + pct(st.unplTarget, 0)},
    tipExtra: i => `<div class="note" style="margin-top:4px">${dowAgg[i].cnt.PERSONAL + dowAgg[i].cnt.MEDICAL + dowAgg[i].cnt.NCNS} absences · ${dowAgg[i].cnt.LATE} lates</div>`});

  /* --- forward 14 days --- */
  const fdates = D.range(D.add(TODAY, 1), D.add(TODAY, 14));
  const hist = aggregate(agents, D.range(D.add(TODAY, -28), TODAY));
  const fRate = hist.unplPct != null && hist.knownDays >= 20 ? hist.unplPct : st.unplTarget;
  const fwd = fdates.map(x => {
    let hc = 0, hrs = 0, ap = 0, pe = 0, apH = 0;
    for (const a of agents) { const i = dayInfo(a, x); if (!i.working) continue; hc++; hrs += i.hrs; if (i.status === 'PTO' || i.status === 'LWOP') { ap++; apH += i.hrs; } }
    for (const r of S.reqs) if (r.kind === 'PTO' && r.status === 'Pending' && (r.dates || []).includes(x) && agents.some(a => a.id === r.agent)) pe++;
    const cap = ptoCap(hc);
    return {x, hc, hrs, ap, pe, cap, proj: hrs ? (apH + fRate * hrs) / hrs : null};
  });
  const fel = $('#ch_fwd');
  Chart.stacked(fel, {labels: fwd.map(f => D.md(f.x)), h: 200, yFmt: v => (v % 1 ? v.toFixed(1) : String(v)), yMin: Math.max(1, ...fwd.map(f => f.cap)), aria: 'PTO load next 14 days',
    tipTitle: i => D.fmt(fwd[i].x), series: [{name: 'Approved PTO', color: '#3987e5', values: fwd.map(f => f.ap)}, {name: 'Pending PTO', color: 'rgba(57,135,229,.45)', values: fwd.map(f => f.pe)}],
    tipExtra: i => `<div class="r"><span>Cap</span><b>${fwd[i].cap}</b></div><div class="r"><span>Scheduled HC</span><b>${fwd[i].hc}</b></div><div class="r"><span>Projected shrink</span><b>${pct(fwd[i].proj)}</b></div>${fwd[i].ap + fwd[i].pe > fwd[i].cap ? '<div class="st-bad" style="margin-top:4px">▲ Over cap</div>' : ''}`});
  /* cap ticks */
  const svg = $('svg', fel);
  if (svg) {
    const f = Chart.frame(fel, 200), n = fwd.length, iw = f.w - f.m.l - f.m.r, ih = f.h - f.m.t - f.m.b, band = iw / n;
    const max = niceMax(Math.max(...fwd.map(z => z.ap + z.pe), ...fwd.map(z => z.cap), 1));
    let s = ''; fwd.forEach((z, i) => { const y = f.m.t + ih * (1 - z.cap / max); s += `<line x1="${f.m.l + band * i + 3}" x2="${f.m.l + band * (i + 1) - 3}" y1="${y}" y2="${y}" stroke="#F5B841" stroke-width="2" stroke-dasharray="4 3" pointer-events="none"/>`; });
    const hl = $('.hl', svg); hl.insertAdjacentHTML('beforebegin', s);
  }
  const over = fwd.filter(f => f.ap + f.pe > f.cap);
  $('#fwd_tbl').innerHTML = `<div class="note">Projected shrinkage = (approved PTO hrs + ${pct(fRate, 1)} forecast unplanned × scheduled hrs) ÷ scheduled hrs. Forecast unplanned = trailing 28-day actual${hist.knownDays >= 20 ? '' : ' (not enough history — using target)'}.</div>` +
    (over.length ? `<div class="warnbox" style="margin-top:8px">▲ ${over.length} day(s) over the PTO cap: ${over.map(f => `<b>${D.md(f.x)}</b> (${f.ap + f.pe}/${f.cap})`).join(', ')}</div>` : `<div class="okbox" style="margin-top:8px">✓ No day in the next 14 is over the PTO cap.</div>`);

  /* --- scorecard --- */
  renderScorecard(agents, dates);
  /* --- heatmap --- */
  renderHeatmap($('#hm'), agents, dates.slice(-31));
  /* --- bradford --- */
  const bf = agents.map(a => ({a, ...bradford(a, dates)})).filter(x => x.score > 0).sort((x, y) => y.score - x.score).slice(0, 12);
  $('#bf').innerHTML = bf.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Agent</th><th class="num">Spells</th><th class="num">Days</th><th class="num">Score</th><th>Band</th></tr></thead><tbody>${bf.map(x => { const [b, c] = bfBand(x.score); return `<tr><td><div style="font-weight:700;font-size:12.5px">${esc(shortName(x.a.name))}</div><div class="muted" style="font-size:11px">${esc(teamLabel(x.a.tl))}</div></td><td class="num">${x.spells}</td><td class="num">${x.days}</td><td class="num"><b>${x.score}</b></td><td><span class="st-${c}">${c === 'good' ? '✓' : '▲'} ${b}</span></td></tr>`; }).join('')}</tbody></table></div>`
    : `<div class="empty"><b>No unplanned absences</b>Nobody in this range has a Personal, Medical or NCNS day.</div>`;
}

function renderScorecard(agents, dates) {
  const d = S.dash;
  const byTeam = myTeamKey() === null && d.team === 'ALL';
  let rows;
  if (byTeam) {
    const g = new Map(); for (const a of agents) { const k = norm(a.tl); if (!g.has(k)) g.set(k, {key: k, name: a.tl, list: []}); g.get(k).list.push(a); }
    rows = [...g.values()].map(t => ({id: t.key, label: teamLabel(t.name), sub: t.list.length + ' agents', ...aggregate(t.list, dates)}));
  } else rows = agents.map(a => ({id: a.id, label: shortName(a.name), sub: a.sme ? 'SME ' + shortName(a.sme) : '', agent: a, ...aggregate([a], dates)}));
  $('#sc_title').textContent = byTeam ? 'Team scorecard' : 'Agent scorecard';
  $('#sc_sub').textContent = byTeam ? 'Click a team to drill into its agents · click headers to sort' : 'Per-agent attendance and shrinkage for the range · click headers to sort';
  const cols = [['label', byTeam ? 'Team' : 'Agent', 0], ...(byTeam ? [['hc', 'HC', 1]] : []), ['schedDays', 'Sched days', 1], ['offDays', 'OFF days', 1], ['absentDays', 'Absent', 1], ['schedHrs', 'Sched hrs', 1], ['att', 'Attendance', 1], ['unplPct', 'Unplanned', 1], ['planPct', 'Planned', 1], ['totPct', 'Total shrink', 1], ['ncns', 'NCNS', 1], ['late', 'Late', 1], ['lostHrs', 'Lost hrs', 1], ['subm', 'Submitted', 1]];
  rows.forEach(r => { r.ncns = r.cnt.NCNS; r.late = r.cnt.LATE + r.cnt.UNDERTIME; });
  const {k, d: dir} = d.sort;
  rows.sort((a, b) => { const x = a[k], y = b[k]; if (typeof x === 'string') return dir * x.localeCompare(y); return dir * ((x == null ? -1 : x) - (y == null ? -1 : y)); });
  const st = S.settings;
  const cell = (r, c) => {
    const v = r[c];
    if (c === 'label') return `<td><b>${esc(v)}</b><div class="muted" style="font-size:11px">${esc(r.sub)}</div></td>`;
    if (c === 'att') { const s = kpiState(v, st.attTarget, 'ge'); return `<td class="num"><span class="${s[1]}">${pct(v)}</span></td>`; }
    if (c === 'unplPct') { const s = kpiState(v, st.unplTarget, 'le'); return `<td class="num"><span class="${s[1]}">${pct(v)}</span></td>`; }
    if (c === 'planPct') { const s = kpiState(v, st.planTarget, 'le'); return `<td class="num"><span class="${s[1]}">${pct(v)}</span></td>`; }
    if (c === 'totPct' || c === 'subm') return `<td class="num">${pct(v)}</td>`;
    if (c === 'schedHrs' || c === 'lostHrs') return `<td class="num">${num(v, 1)}</td>`;
    return `<td class="num">${int(v)}</td>`;
  };
  const total = aggregate(agents, dates); total.ncns = total.cnt.NCNS; total.late = total.cnt.LATE + total.cnt.UNDERTIME; total.label = 'Total'; total.sub = agents.length + ' agents';
  $('#sc_tbl').innerHTML = `<table class="tbl"><thead><tr>${cols.map(([c, l, n]) => `<th class="sortable ${n ? 'num' : ''}" data-k="${c}">${l}${k === c ? (dir > 0 ? ' ▲' : ' ▼') : ''}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r => `<tr class="${byTeam ? 'click' : ''}" data-id="${esc(r.id)}">${cols.map(([c]) => cell(r, c)).join('')}</tr>`).join('') || `<tr><td colspan="${cols.length}" class="muted">No agents in scope.</td></tr>`}</tbody>
    <tfoot><tr>${cols.map(([c]) => cell(total, c)).join('')}</tr></tfoot></table>`;
  $$('#sc_tbl th').forEach(th => th.onclick = () => { const c = th.dataset.k; d.sort = {k: c, d: d.sort.k === c ? -d.sort.d : (c === 'label' ? 1 : -1)}; renderScorecard(agents, dates); });
  if (byTeam) $$('#sc_tbl tbody tr').forEach(tr => tr.onclick = () => { d.team = tr.dataset.id; render(); });
}

function renderHeatmap(el, agents, dates) {
  if (!dates.length || !agents.length) { el.innerHTML = '<div class="empty"><b>Nothing to show</b>No agents or dates in scope.</div>'; return; }
  let h = `<table class="hm"><thead><tr><th class="nm">Agent</th>${dates.map(x => `<th class="${D.dowIdx(x) < 2 ? 'we' : ''}" title="${D.fmt(x)}">${D.dname(x)[0]}<br>${x.slice(8)}</th>`).join('')}</tr></thead><tbody>`;
  for (const a of agents) {
    h += `<tr><td class="nm" title="${esc(a.name)}">${esc(shortName(a.name))}</td>`;
    for (const x of dates) {
      const i = dayInfo(a, x);
      let cls = i.state === 'off' || i.state === 'offtag' ? 'off' : i.state === 'unset' ? 'unset' : (i.state === 'future' || i.state === 'pre') ? 'future' : i.status === 'PRESENT' ? 'present' : i.status;
      if (i.src === 'request') cls += ' req';
      const code = i.state === 'unset' ? '?' : i.status ? ST[i.status].code : '';
      h += `<td><div class="c ${cls}" data-a="${a.id}" data-d="${x}">${code}</div></td>`;
    }
    h += '</tr>';
  }
  el.innerHTML = h + '</tbody></table>';
  el.onmouseover = ev => {
    const c = ev.target.closest('.c'); if (!c) return;
    const a = S.idx.agent[c.dataset.a], i = dayInfo(a, c.dataset.d);
    tip.show(`<div class="t">${esc(shortName(a.name))}</div><div class="muted" style="margin-bottom:4px">${D.fmt(i.iso)} · ${esc(i.working ? shortShift(i.shift) + ' · ' + i.hrs + ' h' : 'OFF')}${i.ov ? ' · changed' : ''}</div>
      <div class="r"><span>Status</span><b>${i.status ? ST[i.status].label : i.state === 'unset' ? 'Not submitted' : i.state === 'future' ? 'Scheduled' : i.state === 'pre' ? 'Before go-live' : 'Off'}</b></div>
      ${i.mins ? `<div class="r"><span>Minutes</span><b>${i.mins}</b></div>` : ''}${i.lost ? `<div class="r"><span>Hours lost</span><b>${num(i.lost, 2)}</b></div>` : ''}
      ${i.src === 'request' ? `<div class="note">From approved request ${esc(i.lv.id)}</div>` : ''}${i.rec && i.rec.submitted_by ? `<div class="note">By ${esc(i.rec.submitted_by)}</div>` : ''}${i.rec && i.rec.note ? `<div class="note">“${esc(i.rec.note)}”</div>` : ''}`, ev);
  };
  el.onmousemove = tip.move; el.onmouseleave = tip.hide;
  el.onclick = ev => { const c = ev.target.closest('.c'); if (!c || c.classList.contains('off')) return; quickEdit(S.idx.agent[c.dataset.a], c.dataset.d); };
}

function quickEdit(a, iso) {
  const i = dayInfo(a, iso);
  if (!i.working) return;
  if (!canEditAgent(a) || !canEditDate(iso)) { toast(iso > TODAY ? 'Future days can be set by approved PTO only.' : 'This day is locked for your role (older than ' + S.settings.lockDays + ' days).'); return; }
  const cur = i.rec ? i.rec.status : '';
  const m = modal(`${shortName(a.name)} · ${D.fmt(iso)}`, `<div class="muted">${esc(shortShift(i.shift))} · ${i.hrs} paid h${i.src === 'request' ? ' · approved PTO ' + esc(i.lv.id) : ''}</div>
    <label class="fld"><span>Status</span><select class="inp" id="qe_s"><option value="">— Not submitted —</option>${ST_ORDER.map(s => `<option value="${s}" ${s === cur ? 'selected' : ''}>${ST[s].label}</option>`).join('')}</select></label>
    <label class="fld"><span>Minutes (Late / Undertime)</span><input class="inp" type="number" min="0" max="600" id="qe_m" value="${i.rec ? i.rec.mins || 0 : 0}"></label>
    <label class="fld"><span>Note</span><input class="inp" id="qe_n" value="${esc(i.rec ? i.rec.note || '' : '')}" maxlength="200"></label>`,
    [{label: 'Cancel'}, {label: 'Save', cls: 'primary', onClick: async () => {
      const s = $('#qe_s').value;
      if (!s) { await Store.saveAttendance([], [i.key]); await Store.audit('attendance_clear', {agent: a.id, date: iso}); }
      else { const rec = makeAtt(a, iso, s, +$('#qe_m').value || 0, $('#qe_n').value.trim()); await Store.saveAttendance([rec]); await Store.audit('attendance_save', {agent: a.id, date: iso, status: s}); }
      toast('Saved.', 'ok'); render();
    }}]);
  return m;
}
function makeAtt(a, iso, status, mins, note) {
  const shift = shiftOf(a, iso), hrs = paidHrs(shift);
  const m = ST[status]; const lost = !parseShift(shift) ? 0 : m.mins ? Math.min(hrs, (mins || 0) / 60) : status === 'PRESENT' ? 0 : hrs;
  return {id: iso + '|' + a.id, date: iso, agent: a.id, status, mins: m.mins ? (mins || 0) : 0, note: note || null, shift, sched_hrs: hrs, lost_hrs: Math.round(lost * 100) / 100, src: 'app', submitted_by: S.user.email, submitted_at: new Date().toISOString()};
}
/* ---------- daily headcount (HC · Scheduled · OFF · Present · Absent) ---------- */
const HC_SEG = [
  {key: 'present', label: 'Present', color: '#7189AE'},
  ...CAT.filter(c => c.key !== 'LATEUT').map(c => ({key: c.key, label: c.label, color: c.color})),
  {key: 'unset', label: 'Not submitted', color: '#8A4A55'},
  {key: 'future', label: 'Scheduled (upcoming)', color: '#3E5275'},
  {key: 'off', label: 'OFF', color: '#222D44'}
];
function dayStaff(agents, x) {
  const z = aggregate(agents, [x]);
  let pend = 0; const ids = new Set(agents.map(a => a.id));
  for (const r of S.reqs) if (r.kind === 'PTO' && r.status === 'Pending' && ids.has(r.agent) && (r.dates || []).includes(x)) pend++;
  const future = x > TODAY ? z.schedDays - z.knownDays : 0;
  return {x, z, hc: z.hc, sched: z.schedDays, off: z.offDays, present: z.present, absent: z.absentDays, unset: z.unset, future,
    seg: {present: z.present, PTO: z.cnt.PTO, PERSONAL: z.cnt.PERSONAL, MEDICAL: z.cnt.MEDICAL, NCNS: z.cnt.NCNS, LWOP: z.cnt.LWOP, unset: z.unset, future, off: z.offDays},
    lateut: z.cnt.LATE + z.cnt.UNDERTIME, pend, cap: ptoCap(z.schedDays)};
}
function renderHC(agents, days) {
  const d = S.dash, view = d.hcView || 'chart';
  const rows = days.map(x => dayStaff(agents, x));
  $('#hc_leg').innerHTML = view === 'chart' ? HC_SEG.map(s => `<span><i style="background:${s.color}"></i>${s.label}</span>`).join('') : '';
  $('#ch_hc').classList.toggle('hidden', view !== 'chart'); $('#hc_tbl').classList.toggle('hidden', view !== 'table');
  if (!rows.length) { $('#ch_hc').innerHTML = '<div class="note">No days in range.</div>'; return; }
  if (view === 'chart') {
    Chart.stacked($('#ch_hc'), {labels: rows.map(r => D.md(r.x)), h: 230, aria: 'Daily headcount by status', yFmt: v => (v % 1 ? '' : String(v)),
      tipTitle: i => D.fmt(rows[i].x) + (rows[i].x > TODAY ? ' · upcoming' : rows[i].x === TODAY ? ' · today' : ''),
      series: HC_SEG.map(s => ({name: s.label, color: s.color, values: rows.map(r => r.seg[s.key] || 0)})),
      tipExtra: i => { const r = rows[i]; return `<div style="border-top:1px solid #2C3C5A;margin-top:4px;padding-top:4px"><div class="r"><span>HC</span><b>${r.hc}</b></div><div class="r"><span>Scheduled</span><b>${r.sched}</b></div><div class="r"><span>OFF</span><b>${r.off}</b></div><div class="r"><span>Attendance</span><b>${pct(r.z.att)}</b></div>${r.lateut ? `<div class="r"><span>Late/UT (present)</span><b>${r.lateut}</b></div>` : ''}${r.pend ? `<div class="r"><span>Pending PTO</span><b>${r.pend}</b></div>` : ''}</div>`; },
      onClick: rows.length > 1 ? i => { if (rows[i].x <= TODAY) { d.preset = 'CUSTOM'; d.from = d.to = rows[i].x; render(); } } : null});
    return;
  }
  const tot = aggregate(agents, days.filter(x => x <= TODAY));
  const sum = k => rows.reduce((s, r) => s + (typeof k === 'function' ? k(r) : r[k]), 0);
  const fut = x => x > TODAY;
  const R = [
    ['WB', r => D.md(D.weekStart(r.x)), ''],
    ['Day', r => D.dname(r.x), ''],
    ['HC', r => r.hc, num(sum('hc') / rows.length, 1) + ' avg'],
    ['Scheduled', r => r.sched, int(sum('sched'))],
    ['OFF', r => r.off, int(sum('off'))],
    ['Present', r => fut(r.x) ? '' : r.present, int(tot.present)],
    ['Absent', r => r.absent || (fut(r.x) ? '' : 0), int(tot.absentDays)],
    ['  PTO', r => r.seg.PTO || '', int(sum(r => r.seg.PTO))],
    ['    PTO hrs', r => r.z.hrs.PTO ? num(r.z.hrs.PTO, 1) : '', num(sum(r => r.z.hrs.PTO), 1)],
    ['  LWOP', r => r.seg.LWOP || '', int(sum(r => r.seg.LWOP))],
    ['  Personal', r => r.seg.PERSONAL || '', int(tot.cnt.PERSONAL)],
    ['  Medical', r => r.seg.MEDICAL || '', int(tot.cnt.MEDICAL)],
    ['    Medical hrs', r => r.z.hrs.MEDICAL ? num(r.z.hrs.MEDICAL, 1) : '', num(tot.hrs.MEDICAL, 1)],
    ['  NCNS', r => r.seg.NCNS || '', int(tot.cnt.NCNS)],
    ['Late / UT', r => r.lateut || '', int(tot.cnt.LATE + tot.cnt.UNDERTIME)],
    ['Not submitted', r => r.unset || '', int(tot.unset)],
    ['Attendance %', r => fut(r.x) ? '' : pct(r.z.att), pct(tot.att)],
    ['Unplanned %', r => fut(r.x) ? '' : pct(r.z.unplPct), pct(tot.unplPct)],
    ['Planned %', r => pct(r.z.planPct), pct(tot.planPct)],
    ['Total shrink %', r => fut(r.x) ? '' : pct(r.z.totPct), pct(tot.totPct)],
    ['Sched hrs', r => num(r.z.schedHrs, 0), int(sum(r => r.z.schedHrs))],
    ['Lost hrs', r => r.z.lostHrs ? num(r.z.lostHrs, 1) : '', num(tot.lostHrs, 1)],
    ['PTO cap', r => r.cap, ''],
    ['Pending PTO', r => r.pend || '', int(sum('pend'))]
  ];

<script>
/* =====================================================================
   REQUESTS (TL submit) + APPROVALS (RTA review)
   PTO/LWOP requests block dates; swaps are stored as a generic list of
   schedule changes [{agent,date,before,after}] applied on approval.
   ===================================================================== */
const SUBTYPE_LABEL = {PTO: 'PTO', LWOP: 'LWOP', AGENT_SWAP: 'Shift swap (2 agents)', SWAP_OFF: 'Swap OFF (2 agents trade rest days)', RESTDAY_SWAP: 'Rest-day swap', SHIFT_CHANGE: 'Shift time change'};
function shiftLibrary() {
  const set = new Set(); for (const a of S.agents) for (const s of (a.sched || [])) if (parseShift(s)) set.add(normShift(s));
  for (const o of Object.values(S.ovr)) if (parseShift(o.shift)) set.add(normShift(o.shift));
  return [...set].sort((x, y) => parseShift(x).start - parseShift(y).start || x.localeCompare(y));
}
function ptoCap(hc) { return hc ? Math.max(1, Math.floor(hc * S.settings.ptoCapPct)) : 0; }
function ptoLoad(date, excludeId) {
  let hc = 0, ap = 0, pe = 0;
  for (const a of S.agents) { if (a.active === false) continue; const i = dayInfo(a, date); if (!i.working) continue; hc++; if (i.status === 'PTO' || i.status === 'LWOP') ap++; }
  for (const r of S.reqs) if (r.kind === 'PTO' && r.status === 'Pending' && r.id !== excludeId && (r.dates || []).includes(date)) pe++;
  return {hc, ap, pe, cap: ptoCap(hc)};
}
function reqConflicts(agentId, dates, excludeId) {
  return S.reqs.filter(r => r.id !== excludeId && (r.status === 'Pending' || r.status === 'Approved') && (r.agent === agentId || r.agent2 === agentId) &&
    ((r.dates || []).some(d => dates.includes(d)) || ((r.payload || {}).changes || []).some(c => c.agent === agentId && dates.includes(c.date))));
}
function reqDates(r) { return r.kind === 'PTO' ? (r.dates || []) : [...new Set(((r.payload || {}).changes || []).map(c => c.date))].sort(); }
function reqSummary(r) {
  const a = S.idx.agent[r.agent] || {name: r.agent}, b = r.agent2 ? (S.idx.agent[r.agent2] || {name: r.agent2}) : null;
  const ds = reqDates(r);
  const when = ds.length ? (ds.length === 1 ? D.fmt(ds[0]) : D.md(ds[0]) + ' – ' + D.md(ds[ds.length - 1]) + ` (${ds.length} day${ds.length > 1 ? 's' : ''})`) : D.md(r.start_date) + ' – ' + D.md(r.end_date) + ' (no scheduled days)';
  return {a, b, when, title: SUBTYPE_LABEL[r.subtype] || r.subtype};
}
function changesTable(changes) {
  return `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Agent</th><th>Date</th><th>Before</th><th></th><th>After</th><th class="num">Hrs Δ</th></tr></thead><tbody>${changes.map(c => {
    const a = S.idx.agent[c.agent] || {name: c.agent}, dh = paidHrs(c.after) - paidHrs(c.before);
    const now = S.idx.agent[c.agent] ? shiftOf(S.idx.agent[c.agent], c.date) : c.before;
    const stale = normShift(now) !== normShift(c.before) && normShift(now) !== normShift(c.after);
    return `<tr><td>${esc(shortName(a.name))}</td><td class="mono">${D.fmt(c.date)}</td><td class="mono">${esc(shortShift(c.before))}${stale ? ` <span class="st-warn" title="Schedule now shows ${esc(now)}">▲ now ${esc(shortShift(now))}</span>` : ''}</td><td class="arrow" style="color:var(--cyan)">→</td><td class="mono" style="color:var(--cyan)">${esc(shortShift(c.after))}</td><td class="num ${dh ? (dh > 0 ? 'st-good' : 'st-warn') : ''}">${dh > 0 ? '+' : ''}${num(dh, 1)}</td></tr>`;
  }).join('')}</tbody></table></div>`;
}
function weeklyHoursImpact(changes) {
  const out = [];
  const keys = new Set(changes.map(c => c.agent + '|' + D.weekStart(c.date)));
  for (const k of keys) {
    const [ag, ws] = k.split('|'); const a = S.idx.agent[ag]; if (!a) continue;
    let before = 0, after = 0;
    for (const d of D.range(ws, D.add(ws, 6))) { const ch = changes.find(c => c.agent === ag && c.date === d); const cur = shiftOf(a, d); before += paidHrs(ch ? ch.before : cur); after += paidHrs(ch ? ch.after : cur); }
    out.push({a, ws, before, after});
  }
  return out;
}
function coverage(date, changes = []) {
  const arr = new Array(24).fill(0);
  for (const a of S.agents) {
    if (a.active === false) continue;
    const ch = changes.find(c => c.agent === a.id && c.date === date);
    const p = parseShift(ch ? ch.after : shiftOf(a, date)); if (!p) continue;
    const i = dayInfo(a, date); if (!ch && (i.status && !PRESENT_SET.has(i.status))) continue;
    for (let h = 0; h < 24; h++) if (h * 60 >= p.start && h * 60 < Math.min(p.end, 1440)) arr[h]++;
  }
  return arr;

      (changes.length ? changesTable(changes) + `<div class="row" style="margin-top:10px">${wk.map(w => `<span class="pill ${w.before === w.after ? '' : 'warn'}">${esc(shortName(w.a.name))} · WB ${D.md(w.ws)}: ${num(w.before, 1)} → ${num(w.after, 1)} h</span>`).join('')}</div>` + dates.slice(0, 3).map(d => coverageStrip(d, changes)).join('') : '');
    $('#s_go').disabled = !!err.length;
    return {changes, err, dates};
  };
  function swapOffChips() {
    const A = S.idx.agent[f.a], B = S.idx.agent[f.b]; if (!A || !B || !$('#s_sa')) return;
    const days = D.range(TODAY, D.add(TODAY, 20));
    const chip = (d, key) => `<button class="btn sm ${f[key] === d ? 'primary' : ''}" data-k="${key}" data-d="${d}">${D.dname(d)} ${D.md(d)}</button>`;
    const d1 = days.filter(d => parseShift(shiftOf(A, d)) && !parseShift(shiftOf(B, d)));
    const d2 = days.filter(d => parseShift(shiftOf(B, d)) && !parseShift(shiftOf(A, d)));
    $('#s_sa').innerHTML = d1.length ? d1.slice(0, 9).map(d => chip(d, 'offA')).join('') : `<span class="note">No day in the next 3 weeks where ${esc(shortName(A.name))} works and ${esc(shortName(B.name))} is OFF.</span>`;
    $('#s_sb').innerHTML = d2.length ? d2.slice(0, 9).map(d => chip(d, 'offB')).join('') : `<span class="note">No day in the next 3 weeks where ${esc(shortName(B.name))} works and ${esc(shortName(A.name))} is OFF.</span>`;
    $$('#s_sa button,#s_sb button').forEach(b => b.onclick = e => { e.preventDefault(); f[b.dataset.k] = b.dataset.d; $(b.dataset.k === 'offA' ? '#s_oa' : '#s_ob').value = b.dataset.d; upd(); });
  }
  $('#s_ty').onchange = () => { f.subtype = $('#s_ty').value; fields(); upd(); };
  $('#s_r').oninput = () => f.reason = $('#s_r').value;
  fields(); upd();
  $('#s_go').onclick = async () => {
    const {changes, err, dates} = upd(); if (err.length) return;
    if (!f.reason.trim()) { toast('Add a reason so RTA can review.', 'err'); $('#s_r').focus(); return; }
    const r = {id: uid('SWP'), kind: 'SWAP', subtype: f.subtype, agent: f.a, agent2: (f.subtype === 'AGENT_SWAP' || f.subtype === 'SWAP_OFF') ? f.b : null, start_date: dates[0], end_date: dates[dates.length - 1], dates,
      payload: {changes}, reason: f.reason.trim(), status: 'Pending', hours: Math.round(changes.reduce((s, c) => s + paidHrs(c.after) - paidHrs(c.before), 0) * 100) / 100,
      submitted_by: S.user.email, submitted_at: new Date().toISOString(), reviewed_by: null, reviewed_at: null, review_note: null};
    if (await Store.saveRequest(r)) { await Store.audit('request_submit', {id: r.id, kind: 'SWAP', subtype: r.subtype}); toast(`${SUBTYPE_LABEL[r.subtype]} ${r.id} submitted.`, 'ok'); S.reqv.swap = null; S.reqv.tab = 'list'; S.reqv.listFilter = 'Pending'; render(); }
  };
}
function reqCard(r, opts = {}) {
  const s = reqSummary(r);
  const mine = r.submitted_by === S.user.email;
  return `<div class="req" data-id="${esc(r.id)}">
    <div class="hd"><span class="tag" style="background:${r.kind === 'PTO' ? '#14294A;color:#9cc4f5' : '#102F2B;color:#7fe0c4'}">${esc(s.title)}</span><b>${esc(shortName(s.a.name))}${s.b ? ' ⇄ ' + esc(shortName(s.b.name)) : ''}</b><span class="muted">${esc(s.when)}</span>${noticeInfo(r)}<span class="spacer"></span>${statusTag(r.status)}<span class="mono muted" style="font-size:11px">${esc(r.id)}</span></div>
    <dl class="kv"><dt>Team</dt><dd>${esc(teamLabel(s.a.tl))}</dd><dt>${r.kind === 'PTO' ? 'Hours' : 'Hours Δ'}</dt><dd>${num(r.hours, 1)} h</dd><dt>Reason</dt><dd>${esc(r.reason || '—')}</dd>
      <dt>Submitted</dt><dd>${esc(r.submitted_by)} · ${esc(String(r.submitted_at).slice(0, 16).replace('T', ' '))}</dd>
      ${r.reviewed_by ? `<dt>Reviewed</dt><dd>${esc(r.reviewed_by)} · ${esc(String(r.reviewed_at || '').slice(0, 16).replace('T', ' '))}${r.review_note ? ' — “' + esc(r.review_note) + '”' : ''}</dd>` : ''}</dl>
    ${opts.detail ? `<div style="margin-top:12px">${r.kind === 'PTO' ? ptoImpactTable(r) : changesTable((r.payload || {}).changes || []) + reqDates(r).slice(0, 2).map(d => coverageStrip(d, (r.payload || {}).changes || [])).join('')}</div>` : ''}
    <div class="row" style="margin-top:12px">
      ${opts.review && r.status === 'Pending' ? `<input class="inp" style="flex:1;min-width:160px" placeholder="Note to TL (required to deny)" data-note>${needsOM(r) ? `<button class="btn" data-act="om">✉ Confirm OM email</button>` : ''}<button class="btn bad" data-act="deny">✕ Deny</button><button class="btn good" data-act="approve" ${needsOM(r) ? 'disabled title="Short notice: confirm the Operations Manager approval email first"' : ''}>✓ Approve</button>` : ''}
      ${!opts.review && r.status === 'Pending' && needsOM(r) && (mine || isRTA()) ? `<button class="btn sm" data-act="om">✉ Confirm OM email</button>` : ''}
      ${!opts.review && r.status === 'Pending' && (mine || isRTA()) ? `<button class="btn sm" data-act="cancel">Cancel request</button>` : ''}
      ${!opts.detail ? `<button class="btn sm ghost" data-act="detail">Details</button>` : ''}
      ${isRTA() && r.status === 'Approved' && opts.history ? `<button class="btn sm" data-act="revoke">Revoke approval</button>` : ''}
    </div></div>`;
}
function wireReqCards(el, opts) {
  $$('.req', el).forEach(c => {
    const r = S.reqs.find(x => x.id === c.dataset.id);
    $$('[data-act]', c).forEach(b => b.onclick = async () => {
      const act = b.dataset.act, note = ($('[data-note]', c) || {}).value || '';
      if (act === 'detail') return modal(r.id, reqCard(r, {detail: true}), [{label: 'Close'}], {wide: true});
      if (act === 'cancel') { if (!(await confirmBox('Cancel request?', `Cancel ${esc(r.id)}?`, 'Cancel request', 'bad'))) return; await reviewReq(r, 'Cancelled', ''); }
      if (act === 'om') return confirmOM(r);
      if (act === 'approve') { if (needsOM(r)) { toast('Confirm the Operations Manager approval email first.', 'err'); return; } await reviewReq(r, 'Approved', note.trim()); }
      if (act === 'deny') { if (!note.trim()) { toast('Add a note explaining the denial.', 'err'); $('[data-note]', c).focus(); return; } await reviewReq(r, 'Denied', note.trim()); }
      if (act === 'revoke') { if (!(await confirmBox('Revoke approval?', `This restores the original schedule / removes the PTO for ${esc(r.id)}.`, 'Revoke', 'bad'))) return; await reviewReq(r, 'Cancelled', 'Approval revoked'); }
    });
  });
}
function confirmOM(r) {
  const om = (r.payload || {}).om || {};
  modal('Confirm Operations Manager approval', `<div class="tx2">${esc(r.id)} was filed with ${(r.payload || {}).notice_days} day(s) notice (goal ${(r.payload || {}).notice_goal}). Record the OM's approval email.</div>
    <label class="fld"><span>OM approver</span><input class="inp" id="om_n" value="${esc(om.name || S.settings.omName || '')}"></label>
    <label class="fld"><span>Email reference</span><input class="inp" id="om_r" value="${esc(om.ref || '')}" placeholder="Subject / date of the approval email"></label>`,
    [{label: 'Cancel'}, {label: 'Confirm approval email', cls: 'primary', onClick: async () => {
      const n = $('#om_n').value.trim(), ref = $('#om_r').value.trim();
      if (!n || !ref) { toast('Enter the OM name and the email reference.', 'err'); return false; }
      const upd = {...r, payload: {...(r.payload || {}), om: {name: n, ref, confirmed: true, confirmed_by: S.user.email, confirmed_at: new Date().toISOString()}}};
      if (await Store.saveRequest(upd)) { await Store.audit('om_confirmed', {id: r.id, om: n}); toast('OM approval recorded.', 'ok'); render(); }
    }}]);
}
async function reviewReq(r, status, note) {
  const prev = r.status;
  if (status === 'Approved' && r.kind === 'PTO') {
    const over = (r.dates || []).filter(d => { const L = ptoLoad(d, r.id); return L.ap + 1 > L.cap; });
    if (over.length && !(await confirmBox('Over the PTO cap', `Approving puts ${over.length} day(s) over the daily cap: ${over.map(D.md).join(', ')}. Approve anyway?`, 'Approve anyway'))) return;
  }
  const upd = {...r, status, reviewed_by: status === 'Cancelled' && prev === 'Pending' ? null : S.user.email, reviewed_at: status === 'Cancelled' && prev === 'Pending' ? null : new Date().toISOString(), review_note: note || r.review_note || null};
  if (status === 'Cancelled' && prev === 'Pending') upd.review_note = 'Cancelled by ' + S.user.email;
  const changes = (r.payload || {}).changes || [];
  if (r.kind === 'SWAP' && status === 'Approved') {
    const put = [], del = [];
    for (const c of changes) { const a = S.idx.agent[c.agent]; if (!a) continue; const id = c.date + '|' + a.id; if (normShift(baseShift(a, c.date)) === normShift(c.after)) { if (S.ovr[id]) del.push(id); } else put.push({id, date: c.date, agent: a.id, shift: normShift(c.after), note: SUBTYPE_LABEL[r.subtype] + ' ' + r.id, req_id: r.id, created_by: S.user.email, created_at: new Date().toISOString()}); }
    if (!(await Store.saveOverrides(put, del))) return;
  }
  if (r.kind === 'SWAP' && prev === 'Approved' && status === 'Cancelled') {
    const put = [], del = [];
    for (const c of changes) { const a = S.idx.agent[c.agent]; if (!a) continue; const id = c.date + '|' + a.id; if (normShift(baseShift(a, c.date)) === normShift(c.before)) { if (S.ovr[id]) del.push(id); } else put.push({id, date: c.date, agent: a.id, shift: normShift(c.before), note: 'Restored after revoking ' + r.id, req_id: null, created_by: S.user.email, created_at: new Date().toISOString()}); }
    if (!(await Store.saveOverrides(put, del))) return;
  }
  if (await Store.saveRequest(upd)) { await Store.audit('request_' + status.toLowerCase(), {id: r.id, from: prev}); toast(`${r.id} ${status.toLowerCase()}.`, status === 'Denied' ? '' : 'ok'); render(); }
}
function reqList(el) {
  const v = S.reqv, scope = new Set(scopeAgents('ALL').map(a => a.id));
  const list = S.reqs.filter(r => scope.has(r.agent) || scope.has(r.agent2)).filter(r => v.listFilter === 'All' || r.status === v.listFilter).sort((a, b) => String(b.submitted_at).localeCompare(String(a.submitted_at)));
  el.innerHTML = `<div class="row" style="margin-bottom:12px"><div class="seg" id="rl_f">${['Pending', 'Approved', 'Denied', 'Cancelled', 'All'].map(s => `<button data-v="${s}" class="${v.listFilter === s ? 'on' : ''}">${s}</button>`).join('')}</div><span class="muted">${list.length} request(s)</span></div>` +
    (list.map(r => reqCard(r, {history: true})).join('') || `<div class="empty"><b>No ${v.listFilter === 'All' ? '' : v.listFilter.toLowerCase()} requests</b>New PTO and swap requests appear here.</div>`);
  $$('#rl_f button').forEach(b => b.onclick = () => { v.listFilter = b.dataset.v; render(); });
  wireReqCards(el, {});
}

/* ---------------- Approvals view (RTA) ---------------- */
function viewAppr(main) {

  const q = v.q.toLowerCase();
  const match = r => (v.type === 'ALL' || r.kind === v.type) && (!q || [r.id, (S.idx.agent[r.agent] || {}).name, (S.idx.agent[r.agent2] || {}).name, r.submitted_by].join(' ').toLowerCase().includes(q));

    `<div class="tabs"><button data-t="queue" class="${v.tab === 'queue' ? 'on' : ''}">Queue (${pend.length})</button><button data-t="hist" class="${v.tab === 'hist' ? 'on' : ''}">History (${hist.length})</button></div>
    <div class="filters" style="position:static"><label class="fld"><span>Type</span><div class="seg" id="ap_t">${[['ALL', 'All'], ['PTO', 'PTO / LWOP'], ['SWAP', 'Swaps']].map(([k, l]) => `<button data-v="${k}" class="${v.type === k ? 'on' : ''}">${l}</button>`).join('')}</div></label>

<script>
/* =====================================================================
   SCHEDULE (weekly Sat–Fri) + HOURS REPORT
   ===================================================================== */
function viewSched(main) {
  const v = S.sched;
  if (!v.week) v.week = D.weekStart(TODAY);
  const days = D.range(v.week, D.add(v.week, 6));
  const agents = scopeAgents(v.team).filter(a => !v.q || a.name.toLowerCase().includes(v.q.toLowerCase()));
  const daily = days.map(() => ({hc: 0, hrs: 0, pto: 0, off: 0}));
  let rows = '';
  for (const a of agents) {
    let wk = 0;
    const cells = days.map((d, k) => {
      const i = dayInfo(a, d); wk += i.hrs;
      if (i.working) { daily[k].hc++; daily[k].hrs += i.hrs; } else daily[k].off++;
      const leave = i.status === 'PTO' || i.status === 'LWOP';
      if (leave) daily[k].pto++;
      const cls = ['sc', i.working ? '' : 'off', i.ov ? 'ovr' : '', leave ? 'lv' : '', isRTA() ? 'edit' : ''].join(' ');
      const t = `${D.fmt(d)} · ${i.shift || 'no schedule'}${i.ov ? ' · changed: ' + (i.ov.note || '') : ''}${leave ? ' · ' + i.status : ''}`;
      return `<td class="${cls}" data-a="${a.id}" data-d="${d}" title="${esc(t)}">${esc(i.working ? shortShift(i.shift) : 'OFF')}${leave ? `<div style="font-size:9.5px">${i.status}</div>` : ''}</td>`;
    }).join('');
    rows += `<tr><td><b style="font-size:12.5px">${esc(shortName(a.name))}</b><div class="muted" style="font-size:11px">${esc(teamLabel(a.tl))}</div></td>${cells}<td class="num"><b>${num(wk, 1)}</b></td></tr>`;
  }
  main.innerHTML = head('Schedule', 'Effective weekly schedule (Sat–Fri). Cyan outline = changed by an approved swap or RTA edit · blue = approved PTO/LWOP.' + (isRTA() ? ' Click a cell to change one day.' : ''),
      `<button class="btn" id="sc_exp">⤓ Export week</button>`) +
    `<div class="filters">
      <label class="fld"><span>Week beginning (Sat)</span><div class="row" style="gap:4px"><button class="btn sm" id="sw_p" aria-label="Previous week">◀</button><input type="date" class="inp" id="sw_d" value="${v.week}"><button class="btn sm" id="sw_n" aria-label="Next week">▶</button><button class="btn sm ghost" id="sw_t">This week</button></div></label>
      <label class="fld"><span>Team</span>${teamSelect('sw_team', v.team)}</label>
      <label class="fld"><span>Search</span><input class="inp" id="sw_q" placeholder="Agent name" value="${esc(v.q)}"></label>
    </div>
    <div class="tbl-wrap" style="max-height:calc(100vh - 260px)"><table class="tbl sg"><thead><tr><th>Agent</th>${days.map(d => `<th style="text-align:center">${D.dname(d)}<br><span style="font-size:10px">${D.md(d)}</span></th>`).join('')}<th class="num">Paid h/wk</th></tr></thead>
    <tbody>${rows || `<tr><td colspan="9" class="muted">No agents in scope.</td></tr>`}</tbody>
    <tfoot><tr><td>Scheduled · OFF<div class="muted" style="font-size:10.5px;font-weight:400">HC ${agents.length} · paid hrs</div></td>${daily.map(x => `<td class="num" style="text-align:center">${x.hc} <span class="muted" style="font-weight:400">· ${x.off} OFF</span><div class="muted" style="font-size:10.5px;font-weight:400">${num(x.hrs, 0)} h${x.pto ? ' · ' + x.pto + ' PTO' : ''}</div></td>`).join('')}<td class="num">${num(daily.reduce((s, x) => s + x.hrs, 0), 1)}</td></tr></tfoot></table></div>`;
  const setW = w => { v.week = D.weekStart(w); render(); };
  $('#sw_p').onclick = () => setW(D.add(v.week, -7)); $('#sw_n').onclick = () => setW(D.add(v.week, 7)); $('#sw_t').onclick = () => setW(TODAY);
  $('#sw_d').onchange = e => e.target.value && setW(e.target.value);
  if (!$('#sw_team').disabled) $('#sw_team').onchange = e => { v.team = e.target.value; render(); };
  $('#sw_q').onchange = e => { v.q = e.target.value; render(); };
  $('#sc_exp').onclick = () => exportXlsx(`OnTrac_Schedule_WB_${v.week}.xlsx`, {Schedule: agents.map(a => { const o = {agent_id: a.id, agent: a.name, team_lead: a.tl || 'Unassigned', sme: a.sme || ''}; let t = 0; days.forEach(d => { const i = dayInfo(a, d); o[D.dname(d) + ' ' + d] = i.working ? normShift(i.shift) + ((i.status === 'PTO' || i.status === 'LWOP') ? ' [' + i.status + ']' : '') : 'OFF'; t += i.hrs; }); o.paid_hrs_week = t; return o; })});
  if (isRTA()) $$('td.sc.edit').forEach(td => td.onclick = () => editDayShift(S.idx.agent[td.dataset.a], td.dataset.d));
}
function editDayShift(a, d) {
