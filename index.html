  modal(`${shortName(a.name)} · ${D.fmt(d)}`, `<div class="muted">Base pattern for ${D.dname(d)}: <b class="mono">${esc(base || '—')}</b>${S.ovr[d + '|' + a.id] ? ` · current change: <b class="mono">${esc(cur)}</b>` : ''}</div>
    <label class="fld"><span>Shift for this day</span><select class="inp" id="ed_s"><option value="OFF" ${!parseShift(cur) ? 'selected' : ''}>OFF</option>${lib.map(s => `<option ${normShift(cur) === s ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select></label>
    <label class="fld"><span>…or custom shift</span><input class="inp" id="ed_c" placeholder="9:00 AM - 6:00 PM"></label>
    <label class="fld"><span>Reason</span><input class="inp" id="ed_n" placeholder="e.g. Approved via email" maxlength="160"></label>
    <div class="note">For TL-initiated changes, prefer a swap request so it's tracked through approval.</div>`,
    [{label: 'Cancel'}, ...(S.ovr[d + '|' + a.id] ? [{label: 'Reset to base', onClick: async () => { await Store.saveOverrides([], [d + '|' + a.id]); await Store.audit('schedule_reset', {agent: a.id, date: d}); toast('Reset to base pattern.', 'ok'); render(); }}] : []),

       await Store.audit('schedule_edit', {agent: a.id, date: d, shift: s}); toast('Schedule updated.', 'ok'); render();
     }}]);
}

function viewRep(main) {
  const v = S.rep;
  if (!v.from) { v.from = D.monthStart(TODAY); v.to = TODAY; }
  const agents = scopeAgents(v.team), dates = D.range(v.from, v.to > TODAY ? TODAY : v.to);
  const rows = agents.map(a => ({a, z: aggregate([a], dates)}));
  const tot = aggregate(agents, dates);
  const cols = [['Sched days', z => int(z.schedDays)], ['Sched hrs', z => num(z.schedHrs, 2)], ['Worked hrs', z => num(z.workedHrs, 2)], ['Late min', z => int(z.lateMins)], ['UT min', z => int(z.utMins)],

    ['Unplanned hrs', z => num(z.unplHrs, 2)], ['Planned hrs', z => num(z.planHrs, 2)], ['Not submitted', z => int(z.unset)], ['Attendance', z => pct(z.att)]];
  main.innerHTML = head('Hours Report', 'Scheduled vs worked vs absent hours per agent, from the schedule and submitted statuses. Not-submitted days count as scheduled but not worked.',
      `<button class="btn" id="rp_x">⤓ Excel (summary + daily)</button><button class="btn" id="rp_c">⤓ CSV</button>`) +
    `<div class="filters"><label class="fld"><span>From</span><input type="date" class="inp" id="rp_f" value="${v.from}"></label><label class="fld"><span>To</span><input type="date" class="inp" id="rp_t" value="${v.to}"></label>
      <label class="fld"><span>Quick</span><div class="seg" id="rp_q"><button data-q="MTD">MTD</button><button data-q="LM">Last month</button><button data-q="WK">This week</button><button data-q="LW">Last week</button></div></label>
      <label class="fld"><span>Team</span>${teamSelect('rp_team', v.team)}</label></div>

    <div class="tbl-wrap" style="max-height:calc(100vh - 330px)"><table class="tbl"><thead><tr><th>Agent</th><th>Team</th>${cols.map(c => `<th class="num">${c[0]}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(({a, z}) => `<tr><td><b style="font-size:12.5px">${esc(a.name)}</b></td><td class="tx2">${esc(teamLabel(a.tl))}</td>${cols.map(c => `<td class="num">${c[1](z)}</td>`).join('')}</tr>`).join('')}</tbody>
    <tfoot><tr><td>Total</td><td>${agents.length} agents</td>${cols.map(c => `<td class="num">${c[1](tot)}</td>`).join('')}</tr></tfoot></table></div>
    <p class="note">Paid hours = shift span − ${S.settings.mealHrs} h unpaid meal (shifts over 5 h). Absent hours = full paid shift for PTO, LWOP, Personal, Medical, NCNS; Late/Undertime = minutes ÷ 60.</p>`;
  $('#rp_f').onchange = e => { v.from = e.target.value; if (v.to < v.from) v.to = v.from; render(); };

  if (!$('#rp_team').disabled) $('#rp_team').onchange = e => { v.team = e.target.value; render(); };
  const summary = () => rows.map(({a, z}) => ({agent_id: a.id, agent: a.name, team_lead: a.tl || 'Unassigned', sme: a.sme || '', sched_days: z.schedDays, sched_hrs: +z.schedHrs.toFixed(2), worked_hrs: +z.workedHrs.toFixed(2), late_min: z.lateMins, undertime_min: z.utMins, pto_days: z.cnt.PTO, pto_hrs: +z.hrs.PTO.toFixed(2), medical_days: z.cnt.MEDICAL, lwop_hrs: +z.hrs.LWOP.toFixed(2), personal_hrs: +z.hrs.PERSONAL.toFixed(2), medical_hrs: +z.hrs.MEDICAL.toFixed(2), ncns_hrs: +z.hrs.NCNS.toFixed(2), unplanned_hrs: +z.unplHrs.toFixed(2), planned_hrs: +z.planHrs.toFixed(2), not_submitted_days: z.unset, attendance_pct: z.att == null ? '' : +(z.att * 100).toFixed(2)}));
  $('#rp_c').onclick = () => download(`OnTrac_Hours_${v.from}_${v.to}.csv`, toCSV(summary()));
  $('#rp_x').onclick = () => {
    const daily = []; for (const a of agents) for (const x of dates) { const i = dayInfo(a, x); if (!i.working && !i.status) continue; daily.push({date: x, week_beginning: D.weekStart(x), agent_id: a.id, agent: a.name, team_lead: a.tl || 'Unassigned', shift: i.shift, sched_paid_hrs: i.hrs, status: i.status || (i.state === 'unset' ? 'NOT_SUBMITTED' : 'OFF'), source: i.src || '', minutes: i.mins || 0, lost_hrs: +i.lost.toFixed(2), worked_hrs: i.status ? +(i.hrs - i.lost).toFixed(2) : 0, submitted_by: i.rec ? i.rec.submitted_by : ''}); }
    exportXlsx(`OnTrac_Hours_${v.from}_${v.to}.xlsx`, {Agent_Summary: summary(), Daily_Detail: daily});
  };
}

<script>

}
function admRoster(el) {

    <button class="btn" id="ar_imp">⤒ Import CSV</button><button class="btn" id="ar_exp">⤓ Export CSV</button><button class="btn primary" id="ar_add">+ Add agent</button></div>
    <div class="tbl-wrap" style="max-height:calc(100vh - 280px)"><table class="tbl sg"><thead><tr><th>ID</th><th>Agent</th><th>Team Lead</th><th>SME</th>${DAYS.map(d => `<th style="text-align:center">${d}</th>`).join('')}<th class="num">h/wk</th><th></th></tr></thead><tbody>
    ${list.map(a => `<tr style="${a.active === false ? 'opacity:.5' : ''}"><td class="mono muted">${esc(a.id)}</td><td><b style="font-size:12.5px">${esc(a.name)}</b>${a.active === false ? ' <span class="pill">inactive</span>' : ''}</td><td class="tx2">${esc(teamLabel(a.tl))}</td><td class="tx2">${esc(a.sme ? shortName(a.sme) : '—')}</td>
      ${(a.sched || []).map(s => `<td class="sc ${parseShift(s) ? '' : 'off'}">${esc(parseShift(s) ? shortShift(s) : (s || '—'))}</td>`).join('')}<td class="num">${num((a.sched || []).reduce((t, s) => t + paidHrs(s), 0), 1)}</td><td><button class="btn sm" data-ed="${esc(a.id)}">Edit</button></td></tr>`).join('')}
    </tbody></table></div><p class="note">Base pattern runs Saturday → Friday. Day-specific changes (swaps, RTA edits) live on the Schedule page and don't alter this pattern.</p>`;
  $('#ar_q').onchange = e => { v.q = e.target.value; render(); };

  $$('[data-ed]', el).forEach(b => b.onclick = () => editAgent(S.idx.agent[b.dataset.ed]));
  $('#ar_exp').onclick = () => download('OnTrac_Roster.csv', toCSV(S.agents.map(a => ({id: a.id, name: a.name, tl: a.tl, sme: a.sme, active: a.active !== false ? 'Y' : 'N', ...Object.fromEntries(DAYS.map((d, k) => [d.toLowerCase(), (a.sched || [])[k] || '']))}))));
  $('#ar_imp').onclick = importRoster;
}
function nextAgentId() { const n = Math.max(0, ...S.agents.map(a => +String(a.id).replace(/\D/g, '') || 0)) + 1; return 'A' + String(n).padStart(3, '0'); }
function editAgent(a) {
  const isNew = !a; a = a || {id: nextAgentId(), name: '', tl: '', sme: '', active: true, sched: ['OFF', 'OFF', '', '', '', '', '']};
  const lib = shiftLibrary(), tls = teams().filter(t => t.key);
  const sel = (k, s) => `<select class="inp" data-day="${k}"><option value="OFF" ${!parseShift(s) ? 'selected' : ''}>OFF</option>${lib.map(x => `<option ${normShift(s) === x ? 'selected' : ''}>${esc(x)}</option>`).join('')}${parseShift(s) && !lib.includes(normShift(s)) ? `<option selected>${esc(normShift(s))}</option>` : ''}</select>`;
  modal(isNew ? 'Add agent' : 'Edit ' + shortName(a.name), `<div class="grid2"><label class="fld"><span>Agent name (LAST, FIRST MIDDLE)</span><input class="inp" id="ea_n" value="${esc(a.name)}"></label><label class="fld"><span>ID</span><input class="inp mono" id="ea_id" value="${esc(a.id)}" ${isNew ? '' : 'disabled'}></label></div>
    <div class="grid2"><label class="fld"><span>Team Lead</span><select class="inp" id="ea_tl"><option value="">Unassigned</option>${tls.map(t => `<option value="${esc(t.name)}" ${norm(t.name) === norm(a.tl) ? 'selected' : ''}>${esc(t.name)}</option>`).join('')}<option value="__new">+ New team lead…</option></select><input class="inp hidden" id="ea_tln" placeholder="LAST, FIRST MIDDLE" style="margin-top:6px"></label>
      <label class="fld"><span>SME</span><input class="inp" id="ea_sme" value="${esc(a.sme || '')}" placeholder="LAST, FIRST"></label></div>
    <div><div class="note" style="margin-bottom:6px">Base weekly pattern (Sat → Fri)</div><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px">${DAYS.map((d, k) => `<label class="fld"><span>${d}</span>${sel(k, (a.sched || [])[k])}</label>`).join('')}</div></div>
    <label class="row" style="gap:8px"><input type="checkbox" id="ea_act" ${a.active !== false ? 'checked' : ''}> Active (inactive agents drop out of HC, dashboards and tagging)</label>`, [
    {label: 'Cancel'}, {label: isNew ? 'Add agent' : 'Save', cls: 'primary', onClick: async () => {
      const name = $('#ea_n').value.trim().toUpperCase(); if (!name) { toast('Name is required.', 'err'); return false; }
      const id = $('#ea_id').value.trim().toUpperCase(); if (isNew && S.idx.agent[id]) { toast('That ID already exists.', 'err'); return false; }
      let tl = $('#ea_tl').value; if (tl === '__new') tl = $('#ea_tln').value.trim().toUpperCase();
      const upd = {...a, id, name, tl, sme: $('#ea_sme').value.trim().toUpperCase(), active: $('#ea_act').checked, sched: $$('[data-day]').sort((x, y) => x.dataset.day - y.dataset.day).map(s => s.value), updated_by: S.user.email, updated_at: new Date().toISOString()};
      if (await Store.saveAgents([upd])) { await Store.audit(isNew ? 'agent_add' : 'agent_edit', {id}); toast('Roster saved.', 'ok'); render(); }
    }}]);
  $('#ea_tl').onchange = e => $('#ea_tln').classList.toggle('hidden', e.target.value !== '__new');
}
function parseCSV(t) {
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < t.length; i++) { const c = t[i];
    if (q) { if (c === '"' && t[i + 1] === '"') { cur += '"'; i++; } else if (c === '"') q = false; else cur += c; }
    else if (c === '"') q = true; else if (c === ',') { row.push(cur); cur = ''; } else if (c === '\n' || c === '\r') { if (c === '\r' && t[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; } else cur += c; }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}
function importRoster() {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.csv,text/csv';
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    const rows = parseCSV(await f.text()); const h = rows.shift().map(x => x.trim().toLowerCase());
    const ix = k => h.indexOf(k);
    if (ix('name') < 0) { toast('CSV needs a "name" column (plus tl, sme, sat…fri).', 'err'); return; }
    const byName = Object.fromEntries(S.agents.map(a => [norm(a.name), a]));
    const out = []; let nid = +nextAgentId().slice(1);
    for (const r of rows) {
      const name = norm(r[ix('name')]); if (!name) continue;
      const ex = byName[name] || {id: 'A' + String(nid++).padStart(3, '0'), name, tl: '', sme: '', active: true, sched: ['', '', '', '', '', '', '']};
      const sched = DAYS.map((d, k) => ix(d.toLowerCase()) >= 0 ? normShift(r[ix(d.toLowerCase())]) || 'OFF' : ex.sched[k]);
      out.push({...ex, name, tl: ix('tl') >= 0 ? norm(r[ix('tl')]) : ex.tl, sme: ix('sme') >= 0 ? norm(r[ix('sme')]) : ex.sme, active: ix('active') >= 0 ? !/^n/i.test(r[ix('active')]) : ex.active !== false, sched});
    }
    if (!(await confirmBox('Import roster', `Update or add <b>${out.length}</b> agent(s) from ${esc(f.name)}?`, 'Import'))) return;
    if (await Store.saveAgents(out)) { await Store.audit('roster_import', {rows: out.length}); toast(out.length + ' agents imported.', 'ok'); render(); }
  };
  inp.click();
}
function admUsers(el) {

    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>User</th><th>Requested</th><th>Role</th><th>Team (TL scope)</th><th>Approved</th><th></th></tr></thead><tbody>

      <td><select class="inp" data-f="tl"><option value="">—</option>${tls.map(t => `<option value="${esc(t.name)}" ${norm(t.name) === norm(p.tl_name) ? 'selected' : ''}>${esc(t.label)}</option>`).join('')}</select></td>
      <td><input type="checkbox" data-f="ap" ${p.approved ? 'checked' : ''} aria-label="Approved"></td>
      <td class="row" style="flex-wrap:nowrap"><button class="btn sm primary" data-save>Save</button>${p.id !== S.user.id ? '<button class="btn sm ghost" data-del>Remove</button>' : ''}</td></tr>`).join('') || '<tr><td colspan="6" class="muted">No users yet.</td></tr>'}
    </tbody></table></div>`;

    $('[data-save]', tr).onclick = async () => {

    };
    const del = $('[data-del]', tr); if (del) del.onclick = async () => { if (await confirmBox('Remove user?', `Remove ${esc(p.email)}'s profile? They'll need to sign up again.`, 'Remove', 'bad')) { await Store.deleteProfile(p.id); await Store.audit('user_remove', {email: p.email}); render(); } };
  });
}
function admSettings(el) {
  const s = S.settings;
  const f = (id, l, val, unit, step = 1, hint = '') => `<label class="fld"><span>${l}</span><div class="row" style="gap:6px;flex-wrap:nowrap"><input class="inp" type="number" id="${id}" value="${val}" step="${step}" min="0" style="width:110px">${unit ? `<b class="muted">${unit}</b>` : ''}</div>${hint ? `<span class="note" style="text-transform:none;letter-spacing:0;font-family:inherit">${hint}</span>` : ''}</label>`;
  el.innerHTML = `<div class="dgrid"><div class="card c6"><h3>Hours & targets</h3><div class="sub">Defaults are working assumptions — set them to OnTrac's contract targets.</div>
    <div class="grid2">${f('st_meal', 'Unpaid meal deduction', s.mealHrs, 'h', 0.25, 'Subtracted from shifts longer than 5 h. 9-h span → 8 paid h.')}${f('st_lock', 'TL edit window', s.lockDays, 'days back', 1, 'Older days need an RTA.')}
    ${f('st_att', 'Attendance goal', +(s.attTarget * 100).toFixed(2), '%', 0.5)}${f('st_unpl', 'Unplanned shrink ceiling', +(s.unplTarget * 100).toFixed(2), '%', 0.5)}
    ${f('st_plan', 'Planned shrink ceiling', +(s.planTarget * 100).toFixed(2), '%', 0.5)}${f('st_cap', 'Daily PTO cap', +(s.ptoCapPct * 100).toFixed(2), '% of sched HC', 0.5, 'Used to flag PTO requests on busy days.')}
    ${f('st_notice', 'PTO notice goal', s.ptoNoticeDays || 14, 'days', 1, 'Less notice needs Operations Manager email approval.')}</div>
    <div class="grid2" style="margin-top:12px"><label class="fld"><span>Operations Manager name</span><input class="inp" id="st_omn" value="${esc(s.omName || '')}"></label><label class="fld"><span>Operations Manager email</span><input class="inp" type="email" id="st_ome" value="${esc(s.omEmail || '')}" placeholder="Pre-fills the short-notice email"></label></div>
    <label class="fld" style="margin-top:12px"><span>Go-live date</span><input class="inp" type="date" id="st_gl" value="${esc(s.goLive || '')}" style="width:180px"><span class="note" style="text-transform:none;letter-spacing:0;font-family:inherit">Scheduled days before this aren't counted as "not submitted".</span></label>
    <label class="fld" style="margin-top:12px"><span>Allowed sign-up email domains</span><input class="inp" id="st_dom" value="${esc((s.allowedDomains || []).join(', '))}"><span class="note" style="text-transform:none;letter-spacing:0;font-family:inherit">Comma-separated. Enforced by the Database on sign-up.</span></label>
    <div class="row" style="margin-top:14px"><button class="btn primary" id="st_save">Save settings</button></div></div>
    <div class="card c6"><h3>Metric definitions</h3><div class="sub">Every number in the app is calculated this way.</div><dl class="kv" style="grid-template-columns:150px 1fr;gap:8px 14px">
      <dt>Paid hours</dt><dd>Shift span − meal deduction (if span &gt; 5 h)</dd>
      <dt>Scheduled</dt><dd>Agent has a working shift that day (base pattern, unless changed by an approved swap or RTA edit)</dd>
      <dt>Attendance %</dt><dd>(Scheduled − Absent) ÷ Scheduled agent-days (tracker logic). Absent = PTO, LWOP, Personal, Medical, NCNS; Late/UT count as present</dd>
      <dt>Unplanned shrink</dt><dd>(Personal + Medical + NCNS paid hrs + Late/UT minutes ÷ 60) ÷ scheduled paid hrs</dd>
      <dt>Planned shrink</dt><dd>(PTO + LWOP paid hrs) ÷ scheduled paid hrs</dd>
      <dt>Submission %</dt><dd>Agent-days with a status ÷ (with a status + not submitted), from go-live through today</dd>
      <dt>PTO notice</dt><dd>Days between submission and the first PTO day. Below the goal (${s.ptoNoticeDays || 14} d) → agent emails the Operations Manager; RTA approval unlocks once the OM email is confirmed</dd>
      <dt>PTO cap</dt><dd>max(1, ⌊scheduled HC × cap %⌋) per day; approved + pending compared against it</dd>
      <dt>Projected shrink</dt><dd>(approved PTO hrs + trailing-28-day unplanned % × scheduled hrs) ÷ scheduled hrs</dd>
      <dt>Bradford factor</dt><dd>Spells² × days of Personal/Medical/NCNS in range; consecutive scheduled days = one spell</dd>

  $('#st_save').onclick = async () => {

    if ([st.attTarget, st.unplTarget, st.planTarget, st.ptoCapPct].some(x => !(x >= 0 && x <= 1))) { toast('Percentages must be between 0 and 100.', 'err'); return; }
    _shCache.clear();

  };
}

    <div class="row"><button class="btn primary" id="cn_go">Connect & reload</button>${S.mode === 'live' ? '<button class="btn" id="cn_off">Disconnect (back to demo)</button>' : ''}</div></div>`}</div>
    <div class="card c6"><h3>Tracker data</h3><div class="sub">${SEED ? `Roster (${SEED.agents.length} agents), Sat–Fri patterns` : 'Roster, Sat–Fri patterns'}, October schedule changes and Leave-tab requests embedded from <span class="mono">Ontrac Attendance Tracker 2.xlsx</span>.</div>
    ${S.mode === 'live' && !SEED ? `<div class="okbox">Tracker roster, schedules and Leave requests are already loaded in the Database. Use Roster & schedule to add or edit agents.</div>` : S.mode === 'live' ? `<button class="btn primary" id="sd_live">Load tracker data into Database</button><div class="note" style="margin-top:8px">Upserts agents and imported requests by ID — safe to re-run. Run once after creating the tables.</div>`
      : `<div class="row"><button class="btn" id="sd_reset">Reset demo data</button><button class="btn" id="sd_clear">Clear sample attendance</button><button class="btn" id="sd_samp">Load sample attendance</button></div>`}
    <div style="border-top:1px solid var(--line);margin-top:14px;padding-top:12px"><h3 style="font-size:13px">Backup</h3><div class="row" style="margin-top:8px"><button class="btn" id="bk_x">⤓ Export full backup (JSON)</button>${S.mode === 'demo' ? '<button class="btn" id="bk_i">⤒ Restore backup</button>' : ''}</div></div></div></div>`;
  const p2 = $('#dbpill2'); p2.innerHTML = S.mode === 'demo' ? '<span class="pill warn"><span class="dot"></span>Demo mode</span>' : '<span class="pill ok"><span class="dot"></span>Live</span>';
  if ($('#cn_go')) $('#cn_go').onclick = () => { const url = $('#cn_u').value.trim().replace(/\/$/, ''), key = $('#cn_k').value.trim(); if (!/^https:\/\//.test(url) || key.length < 30) { toast('Enter the https project URL and the public key.', 'err'); return; } lsSet(LS_CONN, {url, key}); location.reload(); };
  if ($('#cn_off')) $('#cn_off').onclick = async () => { if (await confirmBox('Disconnect?', 'This browser goes back to demo mode. Shared data stays in the Database.', 'Disconnect', 'bad')) { lsDel(LS_CONN); try { await S.sb.auth.signOut(); } catch (e) {} location.reload(); } };
  if ($('#sd_live')) $('#sd_live').onclick = async () => { if (await confirmBox('Load tracker data?', 'Upsert the embedded roster, schedule changes and Leave requests into the Database?', 'Load')) { if (await Store.seedLive()) { await Store.audit('seed_live', {}); toast('Tracker data loaded.', 'ok'); render(); } } };
  if ($('#sd_reset')) $('#sd_reset').onclick = async () => { if (await confirmBox('Reset demo data?', 'Restores the tracker roster and clears every status, request and change made in this browser.', 'Reset', 'bad')) { lsDel(LS_DATA); await Store.initDemo(); S.user = S.profiles.find(p => p.id === S.user.id) || S.profiles[0]; toast('Demo data reset.', 'ok'); render(); } };
  if ($('#sd_clear')) $('#sd_clear').onclick = async () => { const ids = Object.values(S.att).filter(r => r.src === 'sample').map(r => r.id); await Store.saveAttendance([], ids); toast(ids.length + ' sample statuses removed.', 'ok'); render(); };
  if ($('#sd_samp')) $('#sd_samp').onclick = () => demoSample();
  $('#bk_x').onclick = () => download(`OnTrac_Attendance_Backup_${TODAY}.json`, JSON.stringify(snapshot(), null, 1), 'application/json');
  if ($('#bk_i')) $('#bk_i').onclick = () => { const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json'; inp.onchange = async () => { try { const o = JSON.parse(await inp.files[0].text()); if (!o.agents) throw new Error('Not a backup file'); hydrate(o); Store.persistDemo(); toast('Backup restored.', 'ok'); render(); } catch (e) { toast('Restore failed: ' + e.message, 'err'); } }; inp.click(); };
}
function admAudit(el) {
  el.innerHTML = `<div class="tbl-wrap" style="max-height:calc(100vh - 240px)"><table class="tbl"><thead><tr><th>Time</th><th>User</th><th>Action</th><th>Detail</th></tr></thead><tbody>${S.audit.slice(0, 300).map(a => `<tr><td class="mono" style="white-space:nowrap">${esc(String(a.ts).slice(0, 19).replace('T', ' '))}</td><td>${esc(a.actor)}</td><td class="mono">${esc(a.action)}</td><td class="mono muted" style="font-size:11px">${esc(JSON.stringify(a.detail || {}))}</td></tr>`).join('') || '<tr><td colspan="4" class="muted">No activity yet.</td></tr>'}</tbody></table></div>`;
}

/* =====================================================================
   BOOT
   ===================================================================== */
(async function boot() {
  const cfgLive = !/PASTE/.test(CONFIG.DB_URL + CONFIG.DB_KEY) && /^https:\/\//.test(CONFIG.DB_URL);
  const conn = cfgLive ? {url: CONFIG.DB_URL, key: CONFIG.DB_KEY} : lsGet(LS_CONN);
  try {
    if (conn && conn.url) { await Store.initLive(conn.url, conn.key); await Auth.restore(); }
    else { await Store.initDemo(); await Auth.restore(); }
  } catch (e) {
    console.warn(e);
    toast('Database unreachable — running in demo mode. ' + (e.message || ''), 'err');
    S.sb = null; await Store.initDemo(); await Auth.restore();
  }
  render();
  setInterval(() => { if (D.today() !== TODAY && S.user) render(); }, 60000);
})();
</script>
</body>
</html>
